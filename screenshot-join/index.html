<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="スクショ結合"><meta name="theme-color" content="#f4f7fb"><title>スクショ結合</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#142238;--muted:#718096;--line:#dce5ef;--blue:#347fe3}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 13px calc(env(safe-area-inset-bottom) + 30px)}header{height:65px}h1{font-size:25px;margin:5px 0 2px}.small,.notice{font-size:12px;color:var(--muted)}.pick{background:#fff;border:2px dashed #c9d6e5;border-radius:18px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.primary{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-top:12px}.card h2{font-size:17px;margin:0 0 12px}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:60px 1fr 42px 42px 42px;gap:6px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:7px;background:#fafcff}.item img{width:60px;height:78px;object-fit:cover;border-radius:8px;background:#e8edf3}.item .name{font-size:13px;overflow:hidden}.mini{height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px}.del{color:#df3e49}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);font-weight:750;margin-bottom:6px}select,input{width:100%;height:47px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:0 10px;font:inherit;font-size:16px}.result{display:none}.result.show{display:block}.result img{width:100%;max-height:65vh;object-fit:contain;background:#e9eef4;border-radius:13px}.meta{text-align:center;color:var(--muted);font-size:13px;margin:9px}.save{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-weight:850}.secondary{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-weight:750;margin-top:8px}.notice{text-align:center;margin:14px 0;line-height:1.5}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:7px 0}</style></head><body><main class="app"><header><h1>スクショ結合</h1><div class="small">複数の画像を縦に1枚へ</div></header><section class="pick"><div style="font-size:38px">▧</div><b>スクショをまとめて選択</b><p class="small">選んだ順に上から並べます</p><button class="primary" id="pick">画像を選ぶ</button><input id="files" type="file" accept="image/*" multiple hidden></section><section class="card" id="order" style="display:none"><h2>並び順</h2><div class="hint">↑ ↓ で順番を変更できます。不要な画像は × で削除。</div><div class="list" id="list"></div><button class="secondary" id="add">＋ 画像を追加</button></section><section class="card" id="settings" style="display:none"><h2>結合設定</h2><div class="row"><div class="field"><label>画像の間隔</label><select id="gap"><option value="0">なし</option><option value="8">細め</option><option value="20">普通</option><option value="40">太め</option></select></div><div class="field"><label>背景色</label><select id="bg"><option value="#ffffff">白</option><option value="#000000">黒</option></select></div></div><div class="field"><label>出力形式</label><select id="format"><option value="image/png">PNG（スクショ向け）</option><option value="image/jpeg">JPEG（容量小さめ）</option></select></div><button class="primary" id="join" style="width:100%">縦に結合する</button></section><section class="card result" id="result"><h2>結合後</h2><img id="out"><div class="meta" id="meta"></div><a id="save" class="save" download="スクショ結合.png">画像を保存</a><button class="secondary" id="again">設定を変えて作り直す</button></section><div class="notice">画像はサーバーに送信せず、この端末のブラウザ上だけで結合します。</div></main><script>const $=x=>document.getElementById(x);let items=[],url=null;$('pick').onclick=$('add').onclick=()=>$('files').click();$('files').onchange=async e=>{let fs=[...e.target.files];for(const f of fs){try{let im=await load(URL.createObjectURL(f));items.push({im,name:f.name})}catch(_){}}e.target.value='';render()};function load(src){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}function render(){if(!items.length){$('order').style.display=$('settings').style.display='none';return}$('order').style.display=$('settings').style.display='block';$('list').innerHTML=items.map((x,i)=>`<div class="item"><img src="${x.im.src}"><div class="name"><b>${i+1}枚目</b><br>${esc(x.name)}</div><button class="mini" data-up="${i}">↑</button><button class="mini" data-down="${i}">↓</button><button class="mini del" data-del="${i}">×</button></div>`).join('');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);render()})}function move(i,d){let n=i+d;if(n<0||n>=items.length)return;[items[i],items[n]]=[items[n],items[i]];render()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('join').onclick=()=>{if(!items.length)return;let gap=+$('gap').value,bg=$('bg').value,type=$('format').value,maxW=Math.max(...items.map(x=>x.im.naturalWidth));let scale=Math.min(1,4096/maxW),w=Math.round(maxW*scale);let hs=items.map(x=>Math.round(x.im.naturalHeight*(w/x.im.naturalWidth)));let h=hs.reduce((a,b)=>a+b,0)+gap*(items.length-1);if(h>30000){let s=30000/h;w=Math.max(1,Math.floor(w*s));hs=items.map(x=>Math.round(x.im.naturalHeight*(w/x.im.naturalWidth)));h=hs.reduce((a,b)=>a+b,0)+gap*(items.length-1)}let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);let y=0;items.forEach((x,i)=>{ctx.drawImage(x.im,0,y,w,hs[i]);y+=hs[i]+gap});c.toBlob(b=>{if(!b)return alert('画像が大きすぎて作成できませんでした。枚数を減らしてください。');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('out').src=url;$('save').href=url;let ext=type==='image/png'?'png':'jpg';$('save').download='スクショ結合.'+ext;$('meta').textContent=`${w} × ${h} px ／ ${items.length}枚 ／ `+(b.size/1048576<1?(b.size/1024).toFixed(0)+' KB':(b.size/1048576).toFixed(2)+' MB');$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth'})},type,type==='image/jpeg'?.9:undefined)};$('again').onclick=()=>{$('result').classList.remove('show');$('settings').scrollIntoView({behavior:'smooth'})};</script></body></html>
