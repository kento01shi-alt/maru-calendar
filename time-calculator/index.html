<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="時計計算"><meta name="theme-color" content="#f4f7fb"><title>時計の計算</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f4f7fb;color:#172235;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 24px)}.header{padding:12px 6px 10px;font-size:27px;font-weight:850}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#e9eef5;border-radius:14px;padding:4px;margin-bottom:10px}.tab{border:0;background:transparent;color:#6b7a8c;border-radius:11px;min-height:44px;font-weight:800;font-size:15px}.tab.active{background:#287de2;color:white;box-shadow:0 2px 8px #287de233}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #1932500f}.title{font-size:17px;font-weight:800;margin-bottom:12px}.n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#287de2;color:#fff;margin-right:8px}.time{display:grid;grid-template-columns:1fr 20px 1fr;align-items:center;gap:7px}.colon{text-align:center;font-size:28px;font-weight:800}.input{appearance:none;-webkit-appearance:none;width:100%;min-width:0;height:60px;border:1px solid #d9e2ec;border-radius:14px;background:#f9fbfd;font-size:28px;font-weight:800;text-align:center;color:#172235;padding:0 6px}.input:focus{outline:2px solid #b9d9ff;border-color:#6aa9ed}.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:13px;min-height:48px;font:inherit;font-weight:750;background:#eef2f6;color:#465a70;padding:10px 12px}.primary{background:#287de2;color:#fff;font-size:17px;width:100%}.now{width:100%;margin-top:10px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch .active{background:#287de2;color:#fff}.duration{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.unit{text-align:center;font-size:13px;color:#65768a;margin-top:5px;font-weight:700}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.quick .btn{min-height:43px;padding:7px 2px;background:#fff;border:1px solid #dce4ed;font-size:14px}.actions{display:grid;grid-template-columns:1.35fr .75fr;gap:8px;margin-top:13px}.result{background:#eaf5ff;border-color:#c8e3fb;text-align:center}.big{font-size:58px;font-weight:850;color:#0758bd;letter-spacing:-2px;margin:4px 0 9px}.summary,.hint{font-size:14px;color:#65768a}.reuse{width:100%;margin-top:12px;background:#fff;color:#1265c4;border:1px solid #9bc8f4}.historyHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.historyHead .title{margin:0}.textBtn{border:0;background:transparent;color:#66778a;padding:8px}.item{border:1px solid #e1e8ef;background:#fafcfe;border-radius:12px;padding:11px;margin-top:8px}.line{display:flex;align-items:center;gap:7px;font-size:15px}.line strong{margin-left:auto;color:#0860c5;font-size:18px}.small{min-height:40px;background:#fff;color:#1265c4;border:1px solid #c6d9eb}.empty{text-align:center;color:#8996a4;padding:15px}.info{background:#eaf5ff;color:#2366a8;border-radius:14px;padding:13px;font-size:14px;line-height:1.5;margin:10px 0}.targetWrap{display:flex;align-items:center;gap:10px}.target{flex:1;height:64px;border:1px solid #d9e2ec;border-radius:14px;background:#f9fbfd;font-size:30px;font-weight:800;text-align:center;color:#172235}.diff{display:inline-block;border-radius:20px;padding:7px 10px;font-size:13px;font-weight:800;background:#e5f7ec;color:#17834c;white-space:nowrap}.diff.late{background:#ffe8e8;color:#c63c43}.timeline{background:#fff7f7;border:1px solid #ffe0e0;border-radius:16px;padding:8px 14px}.event{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;min-height:57px;border-bottom:1px solid #f2dddd}.event:last-child{border:0}.eventTime{font-size:18px;font-weight:850}.eventName{font-weight:750}.eventDelta{font-size:12px;color:#df4b52}.scheduleDiff{text-align:center;padding:14px 0 2px;font-size:15px}.scheduleDiff b{font-size:25px;color:#16a05b}.scheduleDiff b.late{color:#df4b52}.settingsRow{display:grid;grid-template-columns:1fr 115px 38px;gap:7px;align-items:center;margin:8px 0}.settingsRow input{height:48px;border:1px solid #d9e2ec;border-radius:11px;background:#f9fbfd;color:#172235;padding:0 9px;font-size:16px;min-width:0}.settingsRow input[type=time]{font-weight:800}.del{border:0;background:#fff0f0;color:#d94049;border-radius:10px;height:42px;font-size:18px}.addEvent{width:100%;border:1px dashed #a9c9eb;background:#f5faff;color:#1670cc;margin-top:8px}.save{margin-top:12px}.settingsActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.secondary{background:#eef5fc;color:#176cc5}.settings{display:none}.settings.open{display:block}button:disabled{opacity:.45}
</style></head><body><main class="app"><div class="header">◷ 時計の計算</div><div class="tabs"><button class="tab active" data-page="calc">時間の計算</button><button class="tab" data-page="shift">予定をずらす</button></div>
<div id="calc" class="page active"><section class="card"><div class="title"><span class="n">1</span>基準の時刻</div><div class="time"><input class="input" id="h" inputmode="numeric" placeholder="8"><div class="colon">:</div><input class="input" id="m" inputmode="numeric" placeholder="30"></div><button class="btn now" id="now">◷ 現在時刻を入力</button></section><section class="card"><div class="title"><span class="n">2</span>加減する時間</div><div class="switch"><button class="btn active" id="plus">＋ 足す</button><button class="btn" id="minus">− 引く</button></div><div class="duration"><div><input class="input" id="dh" inputmode="numeric" placeholder="0"><div class="unit">時間</div></div><div><input class="input" id="dm" inputmode="numeric" placeholder="0"><div class="unit">分</div></div></div><div class="quick"><button class="btn q" data-min="5">5分</button><button class="btn q" data-min="10">10分</button><button class="btn q" data-min="15">15分</button><button class="btn q" data-min="30">30分</button><button class="btn q" data-min="60">1時間</button><button class="btn q" data-min="90">1時間30分</button><button class="btn q" data-min="120">2時間</button><button class="btn q" data-min="180">3時間</button></div><div class="actions"><button class="btn primary" id="doCalc">＝ 計算する</button><button class="btn" id="clear">クリア</button></div></section><section class="card result"><div class="title"><span class="n">3</span>計算結果</div><div class="big" id="out">--:--</div><div class="summary" id="summary">時刻と時間を入力してください</div><button class="btn reuse" id="reuse" disabled>↓ この結果から続けて計算</button></section><section class="card"><div class="historyHead"><div class="title">◷ 計算履歴</div><button class="textBtn" id="clearHistory">履歴をクリア</button></div><div id="history"></div></section></div>
<div id="shift" class="page"><div class="info">ⓘ <b>いつもの予定を基準に</b><br>外出時刻を変えると、すべての時刻を同じ差分だけ自動で前後にずらします。</div><section class="card"><div class="title">外出時刻を設定</div><div class="targetWrap"><input class="target" id="targetTime" type="time" value="07:45"><span class="diff" id="diffBadge">40分早く</span></div><div class="hint" id="usualLeave" style="margin:9px 0 13px">いつもの外出時刻：8:25</div><button class="btn primary" id="shiftCalc">＝ 計算する</button></section><section class="card" id="shiftResult"><div class="title">計算結果</div><div class="timeline" id="timeline"></div><div class="scheduleDiff" id="scheduleDiff"></div></section><button class="btn reuse" id="toggleSettings">⚙ いつもの予定を設定</button><section class="card settings" id="settings"><div class="title">いつもの予定の設定</div><div id="scheduleRows"></div><button class="btn addEvent" id="addEvent">＋ 項目を追加</button><div class="settingsActions"><button class="btn secondary" id="resetSchedule">初期設定に戻す</button><button class="btn primary save" id="saveSchedule">保存する</button></div></section></div></main><script>
(function(){'use strict';const $=x=>document.getElementById(x),pad=n=>n<10?'0'+n:''+n,fmt=t=>{t=((t%1440)+1440)%1440;return pad(Math.floor(t/60))+':'+pad(t%60)},toMin=s=>{if(!s||s.indexOf(':')<0)return null;let a=s.split(':').map(Number);return a[0]*60+a[1]},num=v=>{v=String(v||'').replace(/\D/g,'');return v===''?null:+v};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});let sign=1,last=null,hist=[];try{hist=JSON.parse(localStorage.getItem('clockHistory')||'[]')}catch(e){}function saveHist(){localStorage.setItem('clockHistory',JSON.stringify(hist))}function setSign(s){sign=s;$('plus').classList.toggle('active',s===1);$('minus').classList.toggle('active',s===-1)}$('plus').onclick=()=>setSign(1);$('minus').onclick=()=>setSign(-1);$('now').onclick=()=>{let d=new Date();$('h').value=d.getHours();$('m').value=pad(d.getMinutes())};document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{let n=+b.dataset.min;$('dh').value=Math.floor(n/60)||'';$('dm').value=n%60||''});function base(){let a=num($('h').value),b=num($('m').value);return a===null||b===null||a>23||b>59?null:a*60+b}function calc(){let b=base();if(b===null)return alert('基準の時刻を正しく入力してください');let a=num($('dh').value)||0,c=num($('dm').value)||0,d=a*60+c;if(!d)return alert('加減する時間を入力してください');let r=((b+sign*d)%1440+1440)%1440;last=r,op=(sign===1?'＋':'−')+(a?a+'時間':'')+(c?c+'分':'');$('out').textContent=fmt(r);$('summary').textContent=fmt(b)+' '+op+' → '+fmt(r);$('reuse').disabled=false;hist.unshift({b,op,r});hist=hist.slice(0,30);saveHist();renderHist()}$('doCalc').onclick=calc;function use(t){$('h').value=Math.floor(t/60);$('m').value=pad(t%60);$('dh').value='';$('dm').value='';window.scrollTo(0,0)}$('reuse').onclick=()=>last!==null&&use(last);$('clear').onclick=()=>{$('h').value=$('m').value=$('dh').value=$('dm').value='';last=null;$('out').textContent='--:--';$('summary').textContent='時刻と時間を入力してください';$('reuse').disabled=true;setSign(1)};$('clearHistory').onclick=()=>{hist=[];saveHist();renderHist()};function renderHist(){$('history').innerHTML=hist.length?hist.map((x,i)=>'<div class="item"><div class="line"><span>'+fmt(x.b)+'</span><span>'+x.op+'</span><span>→</span><strong>'+fmt(x.r)+'</strong></div><button class="btn small histUse" data-i="'+i+'">この結果から続ける</button></div>').join(''):'<div class="empty">まだ履歴はありません</div>';document.querySelectorAll('.histUse').forEach(b=>b.onclick=()=>use(hist[+b.dataset.i].r))}renderHist();
const defaults=[{name:'起床',time:'07:30'},{name:'お風呂に入る',time:'07:50'},{name:'お風呂から出る',time:'08:03'},{name:'髪を乾かす',time:'08:17'},{name:'外出',time:'08:25'}];let schedule;try{schedule=JSON.parse(localStorage.getItem('dailySchedule')||'null')}catch(e){}if(!Array.isArray(schedule)||!schedule.length)schedule=JSON.parse(JSON.stringify(defaults));function leaveIndex(){let i=schedule.findIndex(x=>x.name==='外出');return i<0?schedule.length-1:i}function renderRows(){$('scheduleRows').innerHTML=schedule.map((x,i)=>'<div class="settingsRow"><input class="sname" data-i="'+i+'" value="'+x.name.replace(/"/g,'&quot;')+'"><input class="stime" data-i="'+i+'" type="time" value="'+x.time+'"><button class="del" data-i="'+i+'">×</button></div>').join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(schedule.length<=1)return;schedule.splice(+b.dataset.i,1);renderRows()})}function syncRows(){document.querySelectorAll('.sname').forEach(e=>schedule[+e.dataset.i].name=e.value.trim()||'予定');document.querySelectorAll('.stime').forEach(e=>schedule[+e.dataset.i].time=e.value||'00:00')}function shift(){let target=toMin($('targetTime').value);if(target===null)return alert('外出時刻を入力してください');let li=leaveIndex(),usual=toMin(schedule[li].time),delta=target-usual;if(delta>720)delta-=1440;if(delta<-720)delta+=1440;let abs=Math.abs(delta),word=delta<0?'早く':delta>0?'遅く':'同じ';$('diffBadge').textContent=delta===0?'いつも通り':abs+'分'+word;$('diffBadge').classList.toggle('late',delta>0);$('usualLeave').textContent='いつもの外出時刻：'+fmt(usual);$('timeline').innerHTML=schedule.map((x,i)=>'<div class="event"><div class="eventTime">'+fmt(toMin(x.time)+delta)+'</div><div class="eventName">'+x.name+'</div><div class="eventDelta">'+(delta===0?'±0分':'('+(delta>0?'+':'')+delta+'分)')+'</div></div>').join('');$('scheduleDiff').innerHTML=delta===0?'いつもと同じ時刻です':'いつもより <b class="'+(delta>0?'late':'')+'">'+abs+'分</b> '+word+'なります'}$('shiftCalc').onclick=shift;$('toggleSettings').onclick=()=>{$('settings').classList.toggle('open');renderRows()};$('addEvent').onclick=()=>{syncRows();schedule.push({name:'予定',time:'08:00'});renderRows()};$('saveSchedule').onclick=()=>{syncRows();localStorage.setItem('dailySchedule',JSON.stringify(schedule));$('settings').classList.remove('open');shift()};$('resetSchedule').onclick=()=>{schedule=JSON.parse(JSON.stringify(defaults));renderRows()};renderRows();shift();})();
</script></body></html>
