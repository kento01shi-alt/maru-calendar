<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="時計計算"><meta name="theme-color" content="#f4f7fb"><title>時計の計算</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#f4f7fb}body{margin:0;background:#f4f7fb;color:#172235;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}.app{width:100%;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 24px)}.header{padding:12px 6px 10px;font-size:27px;font-weight:800}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px rgba(25,50,80,.06)}.title{font-size:17px;font-weight:800;margin-bottom:12px}.n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#287de2;color:#fff;margin-right:8px}.time{display:grid;grid-template-columns:1fr 20px 1fr;align-items:center;gap:7px}.colon{text-align:center;font-size:28px;font-weight:800}.input{appearance:none;-webkit-appearance:none;width:100%;min-width:0;height:64px;border:1px solid #d9e2ec;border-radius:14px;background:#f9fbfd;font-size:30px;font-weight:800;text-align:center;color:#172235;padding:0 6px}.input:focus{outline:2px solid #b9d9ff;border-color:#6aa9ed}.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:13px;min-height:48px;font:inherit;font-weight:750;background:#eef2f6;color:#465a70;padding:10px 12px}.btn:active{opacity:.7}.now{width:100%;margin-top:10px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch .active{background:#287de2;color:#fff}.duration{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.unit{text-align:center;font-size:13px;color:#65768a;margin-top:5px;font-weight:700}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.quick .btn{min-height:43px;padding:7px 2px;background:#fff;border:1px solid #dce4ed;font-size:14px}.actions{display:grid;grid-template-columns:1.35fr .75fr;gap:8px;margin-top:13px}.primary{background:#287de2;color:#fff;font-size:17px}.result{background:#eaf5ff;border-color:#c8e3fb;text-align:center}.big{font-size:60px;line-height:1.05;font-weight:850;color:#0758bd;letter-spacing:-2px;margin:4px 0 9px}.summary{font-size:14px;color:#51657a;min-height:20px}.reuse{width:100%;margin-top:12px;background:#fff;color:#1265c4;border:1px solid #9bc8f4}.historyHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.historyHead .title{margin:0}.textBtn{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#66778a;padding:8px}.history{margin-top:10px}.item{border:1px solid #e1e8ef;background:#fafcfe;border-radius:12px;padding:11px;margin-top:8px}.line{display:flex;align-items:center;gap:7px;font-size:15px}.line strong{margin-left:auto;color:#0860c5;font-size:18px}.itemBtns{display:grid;grid-template-columns:1fr 44px;gap:7px;margin-top:8px}.small{min-height:40px;background:#fff;color:#1265c4;border:1px solid #c6d9eb}.empty{text-align:center;color:#8996a4;padding:15px}button:disabled{opacity:.45}@media(min-width:700px){.app{padding-top:22px}}
</style></head><body><main class="app"><div class="header">◷ 時計の計算</div>
<section class="card"><div class="title"><span class="n">1</span>基準の時刻</div><div class="time"><input class="input" id="h" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="8" autocomplete="off"><div class="colon">:</div><input class="input" id="m" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="30" autocomplete="off"></div><button class="btn now" id="now" type="button">◷ 現在時刻を入力</button></section>
<section class="card"><div class="title"><span class="n">2</span>加減する時間</div><div class="switch"><button class="btn active" id="plus" type="button">＋ 足す</button><button class="btn" id="minus" type="button">− 引く</button></div><div class="duration"><div><input class="input" id="dh" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off"><div class="unit">時間</div></div><div><input class="input" id="dm" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off"><div class="unit">分</div></div></div><div class="quick"><button class="btn q" data-min="5">5分</button><button class="btn q" data-min="10">10分</button><button class="btn q" data-min="15">15分</button><button class="btn q" data-min="30">30分</button><button class="btn q" data-min="60">1時間</button><button class="btn q" data-min="90">1時間30分</button><button class="btn q" data-min="120">2時間</button><button class="btn q" data-min="180">3時間</button></div><div class="actions"><button class="btn primary" id="calc" type="button">＝ 計算する</button><button class="btn" id="clear" type="button">クリア</button></div></section>
<section class="card result"><div class="title"><span class="n">3</span>計算結果</div><div class="big" id="out">--:--</div><div class="summary" id="summary">時刻と時間を入力してください</div><button class="btn reuse" id="reuse" type="button" disabled>↓ この結果から続けて計算</button></section>
<section class="card"><div class="historyHead"><div class="title">◷ 計算履歴</div><button class="textBtn" id="clearHistory" type="button">履歴をクリア</button></div><div id="history" class="history"></div></section></main>
<script>
(function(){'use strict';
function id(x){return document.getElementById(x)} function num(v){v=String(v||'').replace(/[^0-9]/g,'');return v===''?null:parseInt(v,10)} function pad(n){return n<10?'0'+n:String(n)} function fmt(t){t=((t%1440)+1440)%1440;return pad(Math.floor(t/60))+':'+pad(t%60)}
var h=id('h'),m=id('m'),dh=id('dh'),dm=id('dm'),sign=1,last=null,history=[];
try{history=JSON.parse(localStorage.getItem('clockHistory')||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}
function save(){try{localStorage.setItem('clockHistory',JSON.stringify(history))}catch(e){}}
function clean(el,max){el.addEventListener('input',function(){var v=this.value.replace(/[^0-9]/g,'');if(max&&v.length>max)v=v.slice(0,max);this.value=v})}
clean(h,2);clean(m,2);clean(dh,3);clean(dm,4);
function setSign(s){sign=s;id('plus').className='btn'+(s===1?' active':'');id('minus').className='btn'+(s===-1?' active':'')}
id('plus').addEventListener('click',function(){setSign(1)});id('minus').addEventListener('click',function(){setSign(-1)});
id('now').addEventListener('click',function(){var d=new Date();h.value=d.getHours();m.value=pad(d.getMinutes())});
var qs=document.querySelectorAll('.q');for(var i=0;i<qs.length;i++)qs[i].addEventListener('click',function(){var n=parseInt(this.getAttribute('data-min'),10);dh.value=Math.floor(n/60)||'';dm.value=n%60||''});
function base(){var a=num(h.value),b=num(m.value);if(a===null||b===null||a>23||b>59)return null;return a*60+b}
function calculate(){var b=base();if(b===null){alert('基準の時刻を正しく入力してください');return}var a=num(dh.value),c=num(dm.value);a=a===null?0:a;c=c===null?0:c;var delta=a*60+c;if(delta===0){alert('加減する時間を入力してください');return}var r=((b+sign*delta)%1440+1440)%1440;last=r;var op=(sign===1?'＋':'−')+(a?a+'時間':'')+(c?c+'分':'');id('out').textContent=fmt(r);id('summary').textContent=fmt(b)+' '+op+' → '+fmt(r);id('reuse').disabled=false;history.unshift({b:b,op:op,r:r});if(history.length>30)history.length=30;save();render()}
id('calc').addEventListener('click',calculate);
function use(t){h.value=Math.floor(t/60);m.value=pad(t%60);dh.value='';dm.value='';window.scrollTo(0,0);setTimeout(function(){dh.focus()},80)}
id('reuse').addEventListener('click',function(){if(last!==null)use(last)});
id('clear').addEventListener('click',function(){h.value='';m.value='';dh.value='';dm.value='';last=null;id('out').textContent='--:--';id('summary').textContent='時刻と時間を入力してください';id('reuse').disabled=true;setSign(1)});
id('clearHistory').addEventListener('click',function(){history=[];save();render()});
function render(){var box=id('history');while(box.firstChild)box.removeChild(box.firstChild);if(!history.length){var e=document.createElement('div');e.className='empty';e.textContent='まだ履歴はありません';box.appendChild(e);return}for(var i=0;i<history.length;i++){(function(index){var x=history[index],item=document.createElement('div');item.className='item';var line=document.createElement('div');line.className='line';line.innerHTML='<span>'+fmt(x.b)+'</span><span>'+x.op+'</span><span>→</span><strong>'+fmt(x.r)+'</strong>';var bs=document.createElement('div');bs.className='itemBtns';var u=document.createElement('button');u.type='button';u.className='btn small';u.textContent='この結果から続ける';u.addEventListener('click',function(){use(x.r)});var d=document.createElement('button');d.type='button';d.className='btn small';d.textContent='×';d.addEventListener('click',function(){history.splice(index,1);save();render()});bs.appendChild(u);bs.appendChild(d);item.appendChild(line);item.appendChild(bs);box.appendChild(item)})(i)}}
render();
})();
</script></body></html>
