name: Improve screenshot stitching v2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/improve-stitch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Patch matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('image-tools/index.html'); s=p.read_text()
          a=s.index('function sample(im,targetW=220)'); b=s.index("$('autoStitch').onclick",a)
          new=r'''function sample(im,targetW=260){let sc=targetW/im.naturalWidth,w=targetW,h=Math.round(im.naturalHeight*sc),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=w;c.height=h;x.drawImage(im,0,0,w,h);return{d:x.getImageData(0,0,w,h).data,w,h,sc}}
function blockDiff(a,b,ay,by,hh){let sum=0,n=0,step=4,x0=Math.floor(a.w*.04),x1=Math.floor(a.w*.96);for(let y=0;y<hh;y+=step)for(let x=x0;x<x1;x+=step){let ia=((ay+y)*a.w+x)*4,ib=((by+y)*b.w+x)*4,ga=(a.d[ia]*3+a.d[ia+1]*6+a.d[ia+2])/10,gb=(b.d[ib]*3+b.d[ib+1]*6+b.d[ib+2])/10;sum+=Math.min(80,Math.abs(ga-gb));n++}return sum/Math.max(n,1)}
function findMatch(A,B){let a=sample(A),b=sample(B),H=Math.min(a.h,b.h),top=Math.round(H*.07),bottom=Math.round(H*.20),band=Math.max(42,Math.round(H*.14)),best={score:1e9,ay:0,by:0};let ay0=Math.round(a.h*.18),ay1=a.h-bottom-band,by0=top,by1=Math.min(Math.round(b.h*.68),b.h-bottom-band);for(let by=by0;by<=by1;by+=3)for(let ay=ay0;ay<=ay1;ay+=3){let score=blockDiff(a,b,ay,by,band);if(score<best.score)best={score,ay,by}}return{aY:Math.round(best.ay/a.sc),bY:Math.round(best.by/b.sc),score:best.score}}
function browserBottom(im){return Math.round(im.naturalHeight*.18)}
async function stitch(auto=true){if(shots.length<2)return alert('2枚以上選んでください');let stat=$('stStatus');stat.classList.add('show');stat.textContent='広い範囲で重なりを解析中…';await new Promise(r=>setTimeout(r,30));let matches=[];if(auto)for(let i=0;i<shots.length-1;i++){stat.textContent=`重なりを解析中… ${i+1}/${shots.length-1}`;await new Promise(r=>setTimeout(r,10));matches.push(findMatch(shots[i].im,shots[i+1].im))}let W=Math.min(...shots.map(s=>s.im.naturalWidth)),scale=Math.min(1,1600/W),w=Math.round(W*scale),pieces=[];if(!auto)shots.forEach(s=>pieces.push({im:s.im,sy:0,sh:s.im.naturalHeight}));else{let e=Math.min(matches[0].aY,shots[0].im.naturalHeight-browserBottom(shots[0].im));pieces.push({im:shots[0].im,sy:0,sh:e});for(let i=1;i<shots.length-1;i++){let sy=matches[i-1].bY,ey=Math.min(matches[i].aY,shots[i].im.naturalHeight-browserBottom(shots[i].im));if(ey<=sy+50){sy=Math.round(shots[i].im.naturalHeight*.07);ey=shots[i].im.naturalHeight-browserBottom(shots[i].im)}pieces.push({im:shots[i].im,sy,sh:ey-sy})}let sy=matches.at(-1).bY,ey=shots.at(-1).im.naturalHeight-browserBottom(shots.at(-1).im);if(ey<=sy+50)ey=shots.at(-1).im.naturalHeight;pieces.push({im:shots.at(-1).im,sy,sh:ey-sy})}let heights=pieces.map(q=>Math.max(1,Math.round(q.sh*w/q.im.naturalWidth))),h=heights.reduce((a,b)=>a+b,0);if(h>30000){let k=30000/h;w=Math.floor(w*k);heights=pieces.map(q=>Math.max(1,Math.round(q.sh*w/q.im.naturalWidth)));h=heights.reduce((a,b)=>a+b,0)}let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d'),y=0;pieces.forEach((q,i)=>{ctx.drawImage(q.im,0,q.sy,q.im.naturalWidth,q.sh,0,y,w,heights[i]);y+=heights[i]});c.toBlob(blob=>{if(!blob)return alert('画像が大きすぎます');if(surl)URL.revokeObjectURL(surl);surl=URL.createObjectURL(blob);$('stOut').src=surl;$('stSave').href=surl;$('stMeta').textContent=`${w} × ${h} px ／ ${shots.length}枚`;$('stResult').classList.add('show');let av=matches.length?matches.reduce((x,m)=>x+m.score,0)/matches.length:0;stat.textContent=auto?`シームレス結合完了（一致度 ${av<6?'高':av<14?'中':'低'}）`:'通常結合完了';$('stResult').scrollIntoView({behavior:'smooth'})},'image/jpeg',.94)}
'''
          p.write_text(s[:a]+new+s[b:])
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add image-tools/index.html
          git diff --cached --quiet || git commit -m 'Improve large-content screenshot stitching'
          git push
