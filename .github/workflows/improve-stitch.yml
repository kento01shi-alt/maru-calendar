name: Improve screenshot stitching v3
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/improve-stitch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Upgrade matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('image-tools/index.html'); s=p.read_text()
          starts=[x for x in ['function sample(im,targetW=220)','function sample(im,targetW=260)'] if x in s]
          if not starts: raise SystemExit('matcher start not found')
          a=s.index(starts[0]); b=s.index("$('autoStitch').onclick",a)
          new=r'''function sample(im,targetW=300){let sc=targetW/im.naturalWidth,w=targetW,h=Math.round(im.naturalHeight*sc),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=w;c.height=h;x.drawImage(im,0,0,w,h);return{d:x.getImageData(0,0,w,h).data,w,h,sc}}
function pxgray(d,i){return(d[i]*3+d[i+1]*6+d[i+2])/10}
function bandScore(a,b,ay,by,hh){let total=0,n=0,step=4;for(let y=0;y<hh;y+=step)for(let x=Math.floor(a.w*.04);x<Math.floor(a.w*.96);x+=step){let ia=((ay+y)*a.w+x)*4,ib=((by+y)*b.w+x)*4,da=pxgray(a.d,ia),db=pxgray(b.d,ib);total+=Math.min(70,Math.abs(da-db));n++}return total/Math.max(1,n)}
function edgeScore(a,b,ay,by,hh){let total=0,n=0,step=5;for(let y=1;y<hh-1;y+=step)for(let x=Math.floor(a.w*.06);x<Math.floor(a.w*.94);x+=step){let ia=((ay+y)*a.w+x)*4,ib=((by+y)*b.w+x)*4,ia2=((ay+y-1)*a.w+x)*4,ib2=((by+y-1)*b.w+x)*4;total+=Math.abs(Math.abs(pxgray(a.d,ia)-pxgray(a.d,ia2))-Math.abs(pxgray(b.d,ib)-pxgray(b.d,ib2)));n++}return total/Math.max(1,n)}
function findMatch(A,B){let a=sample(A),b=sample(B),H=Math.min(a.h,b.h),top=Math.round(H*.065),bottom=Math.round(H*.20),band=Math.max(55,Math.round(H*.18)),best=[];let ay0=Math.round(a.h*.16),ay1=a.h-bottom-band,by0=top,by1=Math.min(Math.round(b.h*.70),b.h-bottom-band);for(let by=by0;by<=by1;by+=4)for(let ay=ay0;ay<=ay1;ay+=4){let s1=bandScore(a,b,ay,by,band),s2=edgeScore(a,b,ay,by,band),score=s1*.72+s2*.28;best.push({score,ay,by})}best.sort((x,y)=>x.score-y.score);let pick=best[0],second=best.find(q=>Math.abs((q.ay-q.by)-(pick.ay-pick.by))>12)||best[1]||pick,margin=second.score-pick.score;return{aY:Math.round(pick.ay/a.sc),bY:Math.round(pick.by/b.sc),score:pick.score,margin,confidence:pick.score<8&&margin>.8?'high':pick.score<15&&margin>.35?'mid':'low'}}
function browserBottom(im){return Math.round(im.naturalHeight*.185)}
async function stitch(auto=true){if(shots.length<2)return alert('2枚以上選んでください');let stat=$('stStatus');stat.classList.add('show');stat.textContent='文字・輪郭・画像をまとめて解析中…';await new Promise(r=>setTimeout(r,30));let matches=[];if(auto)for(let i=0;i<shots.length-1;i++){stat.textContent=`接続位置を解析中… ${i+1}/${shots.length-1}`;await new Promise(r=>setTimeout(r,10));matches.push(findMatch(shots[i].im,shots[i+1].im))}let W=Math.min(...shots.map(s=>s.im.naturalWidth)),w=Math.round(W*Math.min(1,1600/W)),pieces=[];if(!auto)shots.forEach(s=>pieces.push({im:s.im,sy:0,sh:s.im.naturalHeight}));else{let firstEnd=Math.min(matches[0].aY,shots[0].im.naturalHeight-browserBottom(shots[0].im));pieces.push({im:shots[0].im,sy:0,sh:firstEnd});for(let i=1;i<shots.length-1;i++){let sy=matches[i-1].bY,ey=Math.min(matches[i].aY,shots[i].im.naturalHeight-browserBottom(shots[i].im));if(ey<=sy+40){sy=Math.round(shots[i].im.naturalHeight*.07);ey=shots[i].im.naturalHeight-browserBottom(shots[i].im)}pieces.push({im:shots[i].im,sy,sh:ey-sy})}let sy=matches.at(-1).bY,ey=shots.at(-1).im.naturalHeight-browserBottom(shots.at(-1).im);if(ey<=sy+40)ey=shots.at(-1).im.naturalHeight;pieces.push({im:shots.at(-1).im,sy,sh:ey-sy})}let hs=pieces.map(q=>Math.max(1,Math.round(q.sh*w/q.im.naturalWidth))),h=hs.reduce((x,y)=>x+y,0);if(h>30000){let k=30000/h;w=Math.floor(w*k);hs=pieces.map(q=>Math.max(1,Math.round(q.sh*w/q.im.naturalWidth)));h=hs.reduce((x,y)=>x+y,0)}let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d'),y=0;pieces.forEach((q,i)=>{ctx.drawImage(q.im,0,q.sy,q.im.naturalWidth,q.sh,0,y,w,hs[i]);y+=hs[i]});c.toBlob(blob=>{if(!blob)return alert('画像が大きすぎます');if(surl)URL.revokeObjectURL(surl);surl=URL.createObjectURL(blob);$('stOut').src=surl;$('stSave').href=surl;$('stMeta').textContent=`${w} × ${h} px ／ ${shots.length}枚`;$('stResult').classList.add('show');let low=matches.filter(m=>m.confidence==='low').length,mid=matches.filter(m=>m.confidence==='mid').length;stat.textContent=!auto?'通常結合完了':low?`自動結合完了：${low}か所の判定が不確実です`:mid?`自動結合完了：${mid}か所を慎重判定しました`:'自動結合完了：すべて高精度で一致しました';$('stResult').scrollIntoView({behavior:'smooth'})},'image/jpeg',.95)}
'''
          p.write_text(s[:a]+new+s[b:])
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add image-tools/index.html
          git diff --cached --quiet || git commit -m 'Use multi-band smart screenshot matching'
          git push
