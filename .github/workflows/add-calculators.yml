name: Show ratio result clearly
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-calculators.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show target grams with spoon result
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('time-calculator/index.html')
          s=p.read_text()
          s=s.replace('<div class="toolResult" id="ratioOut">大さじ 2.25</div>','<div class="toolResult" id="ratioOut">75g → 大さじ2.25</div>')
          s=s.replace("document.getElementById('ratioOut').textContent=spoon+' '+nice(r);document.getElementById('ratioSummary').textContent=a+'gに'+spoon+b+' → '+c+'gなら'+spoon+nice(r)","document.getElementById('ratioOut').textContent=c+'g → '+spoon+nice(r);document.getElementById('ratioSummary').textContent=a+'gに'+spoon+b+'なら、'+c+'gでは'+spoon+nice(r)")
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add time-calculator/index.html
          git diff --cached --quiet || (git commit -m 'Show grams in ratio result' && git push)
