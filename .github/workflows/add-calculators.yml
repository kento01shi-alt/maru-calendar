name: Add calculator tools
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-calculators.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tools to clock calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('time-calculator/index.html')
          s=p.read_text()
          if 'id="toolMenu"' in s:
              raise SystemExit()
          css='''.topHead{display:flex;align-items:center;justify-content:space-between}.hamb{border:0;background:transparent;color:#26384d;font-size:28px;width:46px;height:46px}.toolShade{display:none;position:fixed;inset:0;background:#0006;z-index:80}.toolShade.open{display:block}.toolDrawer{position:fixed;z-index:81;right:0;top:0;bottom:0;width:min(84vw,340px);background:#fff;transform:translateX(105%);transition:.2s;padding:calc(env(safe-area-inset-top) + 18px) 14px 20px;box-shadow:-8px 0 30px #0002}.toolDrawer.open{transform:none}.toolHead{display:flex;align-items:center;justify-content:space-between;font-size:21px;font-weight:850;padding:5px 8px 14px}.toolClose{border:0;background:transparent;font-size:28px}.toolItem{width:100%;border:0;border-top:1px solid #e6ebf1;background:#fff;color:#172235;text-align:left;padding:16px 10px;font-size:17px;font-weight:750}.toolItem small{display:block;color:#718196;font-size:12px;margin-top:4px;font-weight:500}.toolPage{display:none}.toolPage.active{display:block}.toolInput{width:100%;height:56px;border:1px solid #d9e2ec;border-radius:13px;background:#f9fbfd;color:#172235;text-align:center;font-size:22px;font-weight:800;padding:0 8px}.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolLabel{font-size:13px;color:#65768a;font-weight:700;margin:4px 0 6px;text-align:center}.toolResult{font-size:42px;font-weight:900;color:#0758bd;text-align:center;margin:8px 0}.convList{margin-top:10px}.convRow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e2e8f0;padding:13px 4px;font-size:17px}.convRow b{color:#0758bd;font-size:20px}.backTool{width:100%;margin-bottom:8px}'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('<main class="app"><div class="header">◷ 時計の計算</div>','<main class="app"><div class="topHead"><div class="header">◷ 時計の計算</div><button class="hamb" id="toolMenu">☰</button></div>',1)
          extra='''<div class="toolShade" id="toolShade"></div><aside class="toolDrawer" id="toolDrawer"><div class="toolHead"><span>計算ツール</span><button class="toolClose" id="toolClose">×</button></div><button class="toolItem" data-tool="main">◷ 時間・予定<small>時間の足し引き、予定をずらす</small></button><button class="toolItem" data-tool="microwave">▤ 電子レンジ換算<small>500W 3分 → 600Wなら何分？</small></button><button class="toolItem" data-tool="ratio">％ 割合・比例計算<small>100gで大さじ3 → 75gなら？</small></button></aside><section class="app toolPage" id="microwave"><button class="btn backTool" data-back>← 時間の計算へ</button><div class="header">電子レンジ換算</div><section class="card"><div class="title">元の加熱条件</div><div class="toolGrid"><div><div class="toolLabel">W数</div><input class="toolInput" id="mwFrom" inputmode="numeric" value="500"></div><div><div class="toolLabel">加熱時間</div><div class="toolGrid"><input class="toolInput" id="mwMin" inputmode="numeric" value="3"><input class="toolInput" id="mwSec" inputmode="numeric" placeholder="0"></div><div class="toolLabel">左：分　右：秒</div></div></div><button class="btn primary" id="mwCalc" style="margin-top:14px">換算する</button></section><section class="card result"><div class="title">換算結果</div><div class="convList" id="mwResults"></div></section></section><section class="app toolPage" id="ratio"><button class="btn backTool" data-back>← 時間の計算へ</button><div class="header">割合・比例計算</div><section class="card"><div class="title">基準</div><div class="toolGrid"><div><div class="toolLabel">基準の量</div><input class="toolInput" id="ratioBase" inputmode="decimal" value="100"></div><div><div class="toolLabel">そのときの量</div><input class="toolInput" id="ratioValue" inputmode="decimal" value="3"></div></div><div class="title" style="margin-top:18px">変更後</div><div class="toolLabel">変更後の量</div><input class="toolInput" id="ratioTarget" inputmode="decimal" value="75"><button class="btn primary" id="ratioCalc" style="margin-top:14px">計算する</button></section><section class="card result"><div class="title">計算結果</div><div class="toolResult" id="ratioOut">2.25</div><div class="summary" id="ratioSummary">100 → 3 の割合なら、75 → 2.25</div></section></section>'''
          s=s.replace('<div class="overlay" id="overlay">',extra+'<div class="overlay" id="overlay">',1)
          js='''\nconst toolDrawer=document.getElementById('toolDrawer'),toolShade=document.getElementById('toolShade');function closeTools(){toolDrawer.classList.remove('open');toolShade.classList.remove('open')}document.getElementById('toolMenu').onclick=()=>{toolDrawer.classList.add('open');toolShade.classList.add('open')};document.getElementById('toolClose').onclick=toolShade.onclick=closeTools;function showTool(name){closeTools();document.querySelector('main.app').style.display=name==='main'?'block':'none';document.querySelectorAll('.toolPage').forEach(x=>x.classList.remove('active'));if(name!=='main')document.getElementById(name).classList.add('active');window.scrollTo(0,0)}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>showTool(b.dataset.tool));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>showTool('main'));function nice(n){return Math.round(n*100)/100}function fmtSecs(sec){sec=Math.round(sec);let m=Math.floor(sec/60),s=sec%60;return m+'分'+(s?String(s).padStart(2,'0')+'秒':'00秒')}function microwave(){let w=+document.getElementById('mwFrom').value,min=+document.getElementById('mwMin').value||0,sec=+document.getElementById('mwSec').value||0,total=min*60+sec;if(!(w>0&&total>0))return alert('W数と加熱時間を入力してください');let watts=[500,600,700,800,1000,1200,1500].filter(x=>x!==w);document.getElementById('mwResults').innerHTML=watts.map(x=>'<div class="convRow"><span>'+x+'W</span><b>'+fmtSecs(total*w/x)+'</b></div>').join('')}document.getElementById('mwCalc').onclick=microwave;microwave();function ratio(){let a=+document.getElementById('ratioBase').value,b=+document.getElementById('ratioValue').value,c=+document.getElementById('ratioTarget').value;if(!(a>0)||!Number.isFinite(b)||!Number.isFinite(c))return alert('数値を正しく入力してください');let r=c*b/a;document.getElementById('ratioOut').textContent=nice(r);document.getElementById('ratioSummary').textContent=a+' → '+b+' の割合なら、'+c+' → '+nice(r)}document.getElementById('ratioCalc').onclick=ratio;ratio();\n'''
          s=s.replace('</script></body>',js+'</script></body>',1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add time-calculator/index.html
          git diff --cached --quiet || (git commit -m 'Add microwave and ratio tools' && git push)
