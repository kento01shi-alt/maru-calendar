<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="画像加工"><meta name="theme-color" content="#f4f7fb"><title>画像加工</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#142238;--muted:#718096;--line:#dce5ef;--blue:#347fe3}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 13px calc(env(safe-area-inset-bottom) + 30px)}header{height:58px;display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0}.small{font-size:12px;color:var(--muted)}.pick{background:var(--card);border:2px dashed #c9d6e5;border-radius:18px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}.pick button,.primary{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px}.preview{display:none;background:#e6ebf1;border-radius:18px;overflow:hidden;position:relative;min-height:200px;align-items:center;justify-content:center}.preview.show{display:flex}.preview img{max-width:100%;max-height:420px;display:block}.change{position:absolute;right:10px;bottom:10px;border:0;background:#182334dd;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:12px}.card h2{font-size:17px;margin:0 0 13px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tab{border:1px solid var(--line);background:#f7f9fc;color:var(--text);border-radius:12px;padding:12px 5px;font-weight:750}.tab.active{background:#eaf3ff;border-color:#78a9eb;color:#2469c1}.panel{display:none}.panel.active{display:block}.field{margin:12px 0}.field label{font-size:13px;color:var(--muted);font-weight:750;display:block;margin:0 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:var(--text);height:48px;padding:0 11px;font:inherit;font-size:16px}.presets{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#f7f9fc;border-radius:11px;padding:9px 12px}.info{font-size:13px;color:var(--muted);line-height:1.6}.result{display:none}.result.show{display:block}.result img{width:100%;max-height:440px;object-fit:contain;background:#e8edf3;border-radius:14px}.meta{text-align:center;font-size:13px;color:var(--muted);margin:9px}.save{display:block;width:100%;text-align:center;text-decoration:none;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-weight:850}.reset{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:750;margin-top:9px}.colorRow{display:grid;grid-template-columns:1fr 60px;gap:8px}.colorRow input[type=color]{padding:5px}.quality{display:grid;grid-template-columns:1fr 55px;align-items:center;gap:8px}input[type=range]{padding:0}.notice{text-align:center;color:var(--muted);font-size:11px;margin:15px 0}</style></head><body><main class="app"><header><div><h1>画像加工</h1><div class="small">写真は端末内だけで処理</div></div></header><section id="pick" class="pick"><div style="font-size:39px;margin-bottom:8px">▧</div><b>加工する写真を選択</b><p class="small">写真ライブラリ・ファイルから選べます</p><button id="pickBtn">写真を選ぶ</button><input id="file" type="file" accept="image/*" hidden></section><section id="preview" class="preview"><img id="sourceImg"><button class="change" id="change">写真を変更</button></section><section class="card" id="tools" style="display:none"><h2>加工する</h2><div class="tabs"><button class="tab active" data-p="resize">リサイズ・圧縮</button><button class="tab" data-p="square">正方形・余白</button><button class="tab" data-p="format">JPEG / PNG</button><button class="tab" data-p="quick">かんたん加工</button></div><div id="resize" class="panel active"><div class="field"><label>長辺のサイズ</label><div class="presets"><button class="chip" data-size="3840">3840px</button><button class="chip" data-size="2048">2048px</button><button class="chip" data-size="1200">1200px</button><button class="chip" data-size="800">800px</button></div></div><div class="field"><label>自由入力（px）</label><input id="maxSize" type="number" inputmode="numeric" value="1200"></div><div class="field"><label>JPEG画質</label><div class="quality"><input id="quality" type="range" min="20" max="100" value="85"><b id="qVal">85%</b></div></div><button class="primary" id="doResize" style="width:100%">リサイズ・圧縮する</button></div><div id="square" class="panel"><div class="field"><label>正方形にする方法</label><select id="squareMode"><option value="crop">中央を正方形に切り抜く</option><option value="pad">余白を追加して正方形</option></select></div><div class="field colorRow"><div><label>余白の色</label><select id="bgPreset"><option value="#ffffff">白</option><option value="#000000">黒</option><option value="custom">自由</option></select></div><input id="bgColor" type="color" value="#ffffff"></div><button class="primary" id="doSquare" style="width:100%">正方形にする</button></div><div id="format" class="panel"><div class="field"><label>変換後の形式</label><select id="formatSel"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><div class="info">PNGは画質劣化がありませんが、写真ではファイルサイズが大きくなることがあります。</div><button class="primary" id="doFormat" style="width:100%;margin-top:12px">形式を変換する</button></div><div id="quick" class="panel"><div class="info" style="margin-bottom:10px">よく使う設定を1タップで実行します。</div><div class="presets"><button class="chip quick" data-q="small">SNS用 1200px</button><button class="chip quick" data-q="tiny">軽量 800px</button><button class="chip quick" data-q="sqcrop">正方形切り抜き</button><button class="chip quick" data-q="sqwhite">白余白で正方形</button></div></div></section><section class="card result" id="result"><h2>加工後</h2><img id="resultImg"><div class="meta" id="meta"></div><a class="save" id="save" download="image.jpg">画像を保存</a><button class="reset" id="useResult">この画像をさらに加工</button></section><div class="notice">画像はサーバーへ送信しません。選んだ写真はこのページ内で処理されます。</div></main><script>const $=x=>document.getElementById(x);let img=null,srcName='image',resultBlob=null,resultURL=null;$('pickBtn').onclick=$('change').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;srcName=f.name.replace(/\.[^.]+$/,'')||'image';let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{img=im;$('sourceImg').src=u;$('pick').style.display='none';$('preview').classList.add('show');$('tools').style.display='block';$('result').classList.remove('show')};im.src=u;e.target.value=''};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{$('maxSize').value=b.dataset.size});$('quality').oninput=()=>{$('qVal').textContent=$('quality').value+'%'};function canvasOut(w,h,draw,type='image/jpeg',quality=.85){let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');draw(x,c);c.toBlob(blob=>{if(!blob)return;resultBlob=blob;if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(blob);$('resultImg').src=resultURL;let ext=type==='image/png'?'png':'jpg';$('save').download=srcName+'_加工.'+ext;$('save').href=resultURL;$('meta').textContent=w+' × '+h+' px ／ '+(blob.size/1024/1024<1?(blob.size/1024).toFixed(0)+' KB':(blob.size/1024/1024).toFixed(2)+' MB');$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth'})},type,quality)}function resize(max=+$('maxSize').value,q=+$('quality').value/100){if(!img)return;max=Math.max(1,max||1200);let s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);canvasOut(w,h,(x)=>x.drawImage(img,0,0,w,h),'image/jpeg',q)}function square(mode=$('squareMode').value){if(!img)return;let iw=img.naturalWidth,ih=img.naturalHeight;if(mode==='crop'){let z=Math.min(iw,ih),sx=(iw-z)/2,sy=(ih-z)/2;canvasOut(z,z,x=>x.drawImage(img,sx,sy,z,z,0,0,z,z),'image/jpeg',+$('quality').value/100)}else{let z=Math.max(iw,ih),bg=$('bgPreset').value==='custom'?$('bgColor').value:$('bgPreset').value;canvasOut(z,z,x=>{x.fillStyle=bg;x.fillRect(0,0,z,z);x.drawImage(img,(z-iw)/2,(z-ih)/2)},'image/jpeg',+$('quality').value/100)}}$('doResize').onclick=()=>resize();$('doSquare').onclick=()=>square();$('doFormat').onclick=()=>{if(!img)return;let t=$('formatSel').value;canvasOut(img.naturalWidth,img.naturalHeight,x=>{if(t==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,img.naturalWidth,img.naturalHeight)}x.drawImage(img,0,0)},t,+$('quality').value/100)};document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{let q=b.dataset.q;if(q==='small')resize(1200,.85);if(q==='tiny')resize(800,.75);if(q==='sqcrop')square('crop');if(q==='sqwhite'){$('bgPreset').value='#ffffff';square('pad')}});$('useResult').onclick=()=>{if(!resultBlob)return;let u=URL.createObjectURL(resultBlob),im=new Image;im.onload=()=>{img=im;$('sourceImg').src=u;$('result').classList.remove('show');scrollTo({top:0,behavior:'smooth'})};im.src=u};</script></body></html>
