<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="画像加工"><meta name="theme-color" content="#f4f7fb"><title>画像加工</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#142238;--muted:#718096;--line:#dce5ef;--blue:#347fe3}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 13px calc(env(safe-area-inset-bottom) + 30px)}header{height:58px}h1{font-size:25px;margin:5px 0 2px}.small,.hint{font-size:12px;color:var(--muted)}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.mode button,.tab{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-weight:800}.mode button.active,.tab.active{background:#eaf3ff;border-color:#78a9eb;color:#2469c1}.pick{background:#fff;border:2px dashed #c9d6e5;border-radius:18px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.primary{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px}.preview{display:none;background:#e6ebf1;border-radius:18px;overflow:hidden;position:relative;min-height:200px;align-items:center;justify-content:center}.preview.show{display:flex}.preview img{max-width:100%;max-height:420px}.change{position:absolute;right:10px;bottom:10px;border:0;background:#182334dd;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:12px}.card h2{font-size:17px;margin:0 0 12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel{display:none}.panel.active{display:block}.field{margin:12px 0}.field label{font-size:13px;color:var(--muted);font-weight:750;display:block;margin-bottom:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:0 11px;font:inherit;font-size:16px}.presets{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#f7f9fc;border-radius:11px;padding:9px 12px}.result{display:none}.result.show{display:block}.result img{width:100%;max-height:65vh;object-fit:contain;background:#e8edf3;border-radius:14px}.meta{text-align:center;font-size:13px;color:var(--muted);margin:9px}.save{display:block;width:100%;text-align:center;text-decoration:none;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-weight:850}.secondary{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-weight:750;margin-top:8px}.notice{text-align:center;color:var(--muted);font-size:11px;margin:15px}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:58px 1fr 40px 40px 40px;gap:5px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:7px}.item img{width:58px;height:74px;object-fit:cover;border-radius:8px}.mini{height:39px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px}.del{color:#d33}.status{padding:11px;border-radius:12px;background:#f3f7fc;color:#52657b;font-size:13px;margin:10px 0;display:none}.status.show{display:block}</style></head><body><main class="app"><header><h1>画像加工</h1><div class="small">画像は端末内だけで処理</div></header><div class="mode"><button id="normalMode" class="active">画像加工</button><button id="stitchMode">スクショ結合</button></div><div id="normal"><section id="pick" class="pick"><b>加工する写真を選択</b><p class="small">リサイズ・圧縮・正方形・形式変換</p><button class="primary" id="pickBtn">写真を選ぶ</button><input id="file" type="file" accept="image/*" hidden></section><section id="preview" class="preview"><img id="sourceImg"><button class="change" id="change">写真を変更</button></section><section class="card" id="tools" style="display:none"><h2>加工する</h2><div class="tabs"><button class="tab active" data-p="resize">リサイズ・圧縮</button><button class="tab" data-p="square">正方形・余白</button><button class="tab" data-p="format">JPEG / PNG</button><button class="tab" data-p="quick">かんたん加工</button></div><div id="resize" class="panel active"><div class="field"><label>長辺</label><input id="maxSize" type="number" value="1200"></div><div class="field"><label>JPEG画質</label><input id="quality" type="range" min="20" max="100" value="85"></div><button class="primary" id="doResize" style="width:100%">リサイズ・圧縮する</button></div><div id="square" class="panel"><div class="field"><select id="squareMode"><option value="crop">中央を正方形に切り抜く</option><option value="pad">白余白で正方形</option></select></div><button class="primary" id="doSquare" style="width:100%">正方形にする</button></div><div id="format" class="panel"><div class="field"><select id="formatSel"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><button class="primary" id="doFormat" style="width:100%">形式を変換する</button></div><div id="quick" class="panel"><div class="presets"><button class="chip quick" data-q="small">1200px</button><button class="chip quick" data-q="tiny">800px</button><button class="chip quick" data-q="sqcrop">正方形切り抜き</button></div></div></section><section class="card result" id="result"><h2>加工後</h2><img id="resultImg"><div class="meta" id="meta"></div><a class="save" id="save" download="image.jpg">画像を保存</a></section></div><div id="stitch" style="display:none"><section class="pick"><b>連続したスクショをまとめて選択</b><p class="small">同じ場所が少し重なるように撮ったスクショ向け</p><button class="primary" id="stPick">スクショを選ぶ</button><input id="stFiles" type="file" accept="image/*" multiple hidden></section><section class="card" id="stOrder" style="display:none"><h2>スクショ</h2><div class="hint">上からページの順番に並べてください。</div><div class="list" id="stList"></div><button class="secondary" id="stAdd">＋ 追加</button></section><section class="card" id="stTools" style="display:none"><h2>自動でつなぐ</h2><div class="hint">画像同士の重複部分を画素で探し、同じ文字や画像が二重にならない位置で自動カットします。ステータスバーなど固定部分は重複判定からなるべく除外します。</div><div id="stStatus" class="status"></div><button class="primary" id="autoStitch" style="width:100%;margin-top:10px">自動でシームレス結合</button></section><section class="card result" id="stResult"><h2>結合後</h2><img id="stOut"><div class="meta" id="stMeta"></div><a class="save" id="stSave" download="ロングスクショ.jpg">画像を保存</a><button class="secondary" id="plainStitch">うまくいかない時：そのまま縦結合</button></section></div><div class="notice">サーバーへの画像アップロードは行いません。</div></main><script>const $=x=>document.getElementById(x);let img=null,srcName='image',rurl=null;$('normalMode').onclick=()=>mode(0);$('stitchMode').onclick=()=>mode(1);function mode(s){$('normal').style.display=s?'none':'block';$('stitch').style.display=s?'block':'none';$('normalMode').classList.toggle('active',!s);$('stitchMode').classList.toggle('active',!!s)}$('pickBtn').onclick=$('change').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;srcName=f.name.replace(/\.[^.]+$/,'');let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{img=im;$('sourceImg').src=u;$('pick').style.display='none';$('preview').classList.add('show');$('tools').style.display='block'};im.src=u};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});function out(w,h,draw,type='image/jpeg',q=.85){let c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));c.toBlob(b=>{if(rurl)URL.revokeObjectURL(rurl);rurl=URL.createObjectURL(b);$('resultImg').src=rurl;$('save').href=rurl;$('save').download=srcName+'_加工.'+(type==='image/png'?'png':'jpg');$('meta').textContent=w+' × '+h+' px';$('result').classList.add('show')},type,q)}function resize(max=+$('maxSize').value,q=+$('quality').value/100){let s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);out(w,h,x=>x.drawImage(img,0,0,w,h),'image/jpeg',q)}$('doResize').onclick=()=>resize();$('doSquare').onclick=()=>{let iw=img.naturalWidth,ih=img.naturalHeight,z=$('squareMode').value==='crop'?Math.min(iw,ih):Math.max(iw,ih);out(z,z,x=>{if($('squareMode').value==='pad'){x.fillStyle='#fff';x.fillRect(0,0,z,z);x.drawImage(img,(z-iw)/2,(z-ih)/2)}else{x.drawImage(img,(iw-z)/2,(ih-z)/2,z,z,0,0,z,z)}})};$('doFormat').onclick=()=>{let t=$('formatSel').value;out(img.naturalWidth,img.naturalHeight,x=>{if(t==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,img.naturalWidth,img.naturalHeight)}x.drawImage(img,0,0)},t)};document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>b.dataset.q==='small'?resize(1200):b.dataset.q==='tiny'?resize(800,.75):$('doSquare').click());let shots=[],surl=null;$('stPick').onclick=$('stAdd').onclick=()=>$('stFiles').click();$('stFiles').onchange=async e=>{for(let f of [...e.target.files]){let u=URL.createObjectURL(f);shots.push({im:await load(u),name:f.name})}e.target.value='';renderShots()};function load(u){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=u})}function renderShots(){$('stOrder').style.display=$('stTools').style.display=shots.length?'block':'none';$('stList').innerHTML=shots.map((s,i)=>`<div class="item"><img src="${s.im.src}"><div class="small"><b>${i+1}枚目</b><br>${s.name}</div><button class="mini" onclick="mv(${i},-1)">↑</button><button class="mini" onclick="mv(${i},1)">↓</button><button class="mini del" onclick="rm(${i})">×</button></div>`).join('')}window.mv=(i,d)=>{let n=i+d;if(n>=0&&n<shots.length){[shots[i],shots[n]]=[shots[n],shots[i]];renderShots()}};window.rm=i=>{shots.splice(i,1);renderShots()};function sample(im,targetW=240){let sc=targetW/im.naturalWidth,w=targetW,h=Math.round(im.naturalHeight*sc),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return {d:c.getContext('2d').getImageData(0,0,w,h).data,w,h,sc}}function diff(a,b,ay,by,hh){let step=4,sum=0,n=0,x0=Math.floor(a.w*.08),x1=Math.floor(a.w*.92);for(let y=0;y<hh;y+=step)for(let x=x0;x<x1;x+=step){let ia=((ay+y)*a.w+x)*4,ib=((by+y)*b.w+x)*4;sum+=Math.abs(a.d[ia]-b.d[ib])+Math.abs(a.d[ia+1]-b.d[ib+1])+Math.abs(a.d[ia+2]-b.d[ib+2]);n+=3}return sum/n}function findOverlap(A,B){let a=sample(A),b=sample(B),topSkip=Math.round(a.h*.08),bottomSkip=Math.round(a.h*.06),min=Math.round(Math.min(a.h,b.h)*.10),max=Math.round(Math.min(a.h,b.h)*.75),best={score:1e9,ov:0};for(let ov=min;ov<=max;ov+=2){let ay=a.h-bottomSkip-ov,by=topSkip;if(ay<topSkip||by+ov>b.h-bottomSkip)continue;let s=diff(a,b,ay,by,ov);if(s<best.score)best={score:s,ov,scale:a.sc,topSkip,bottomSkip}}return {overlapPx:Math.round(best.ov/best.scale),score:best.score}}async function stitch(auto=true){if(shots.length<2)return alert('2枚以上選んでください');let stat=$('stStatus');stat.classList.add('show');stat.textContent='重複部分を解析中…';await new Promise(r=>setTimeout(r,30));let cuts=[0],scores=[];if(auto){for(let i=0;i<shots.length-1;i++){let m=findOverlap(shots[i].im,shots[i+1].im);cuts.push(m.overlapPx);scores.push(m.score)}}else{for(let i=1;i<shots.length;i++)cuts.push(0)}let w=Math.min(...shots.map(s=>s.im.naturalWidth)),scale=Math.min(1,1600/w);w=Math.round(w*scale);let hs=shots.map(s=>Math.round(s.im.naturalHeight*(w/s.im.naturalWidth))),crop=cuts.map((c,i)=>i?Math.round(c*(w/shots[i].im.naturalWidth)):0);let h=hs.reduce((a,b)=>a+b,0)-crop.reduce((a,b)=>a+b,0);if(h>30000){let k=30000/h;w=Math.floor(w*k);hs=shots.map(s=>Math.round(s.im.naturalHeight*(w/s.im.naturalWidth)));crop=cuts.map((c,i)=>i?Math.round(c*(w/shots[i].im.naturalWidth)):0);h=hs.reduce((a,b)=>a+b,0)-crop.reduce((a,b)=>a+b,0)}let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d'),y=0;shots.forEach((s,i)=>{let srcCrop=cuts[i],srcH=s.im.naturalHeight-srcCrop,dstH=hs[i]-crop[i];x.drawImage(s.im,0,srcCrop,s.im.naturalWidth,srcH,0,y,w,dstH);y+=dstH});c.toBlob(b=>{if(!b)return alert('画像が大きすぎます');if(surl)URL.revokeObjectURL(surl);surl=URL.createObjectURL(b);$('stOut').src=surl;$('stSave').href=surl;$('stMeta').textContent=`${w} × ${h} px ／ ${shots.length}枚`;$('stResult').classList.add('show');stat.textContent=auto?'自動解析完了。重複部分をカットして結合しました。':'通常の縦結合で作成しました。';$('stResult').scrollIntoView({behavior:'smooth'})},'image/jpeg',.92)}$('autoStitch').onclick=()=>stitch(true);$('plainStitch').onclick=()=>stitch(false);</script></body></html>
