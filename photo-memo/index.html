<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="写真メモ"><meta name="theme-color" content="#f5f8fc"><title>写真メモ</title><style>:root{--b:#347fe3;--bg:#f5f8fc;--card:#fff;--text:#152238;--muted:#718096;--line:#dfe7f0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 90px)}header{display:flex;align-items:center;justify-content:space-between;height:55px}h1{font-size:26px;margin:0}.icon{border:0;background:transparent;font-size:25px}.search{display:none;margin:5px 0 12px}.search.show{display:block}.search input,.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;font:inherit;font-size:16px}.cats{display:flex;gap:7px;overflow:auto;padding:8px 0 13px;scrollbar-width:none}.cat{white-space:nowrap;border:0;border-radius:13px;background:#e9eef5;color:#5e6f83;padding:10px 15px;font-weight:750}.cat.active{background:var(--b);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.memo{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #1c36500d}.thumb{width:100%;aspect-ratio:1.35;object-fit:cover;background:#e9eef5}.memoBody{padding:10px}.badge{display:inline-block;background:#e9f2ff;color:#2770ce;border-radius:12px;padding:3px 8px;font-size:11px;font-weight:800}.date{color:var(--muted);font-size:11px;margin:6px 0}.memo h3{font-size:15px;margin:4px 0}.memo p{font-size:12px;line-height:1.45;margin:5px 0;color:#45566a;white-space:pre-wrap}.empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}.fab{position:fixed;right:max(18px,calc((100vw - 650px)/2 + 18px));bottom:calc(env(safe-area-inset-bottom) + 20px);border:0;border-radius:28px;background:var(--b);color:#fff;padding:16px 22px;font-weight:800;font-size:16px;box-shadow:0 8px 25px #347fe355}.screen{display:none}.screen.active{display:block}.editHead{display:grid;grid-template-columns:50px 1fr 70px;align-items:center;text-align:center;margin-bottom:10px}.editHead b{font-size:20px}.save{border:0;border-radius:18px;background:var(--b);color:#fff;padding:10px;font-weight:800}.photoBox{position:relative;background:#e8edf4;border-radius:16px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center}.photoBox img{width:100%;max-height:360px;object-fit:cover}.photoBtn{border:0;background:#172235;color:#fff;border-radius:11px;padding:11px 14px;font-weight:750}.field{margin:15px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field textarea{height:110px;resize:none}.editCats{display:flex;flex-wrap:wrap;gap:7px}.delete{width:100%;border:0;border-radius:13px;background:#fff0f0;color:#e23f48;padding:14px;font-weight:800;margin-top:15px}.detailImg{width:100%;max-height:420px;object-fit:cover;border-radius:16px;background:#e9eef5}.detail h2{margin:16px 0 4px}.detailText{background:#fff;border-radius:15px;border:1px solid var(--line);padding:15px;white-space:pre-wrap;line-height:1.55;margin-top:15px}.detailMeta{color:var(--muted);font-size:13px}.notice{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}@media(max-width:370px){.grid{gap:7px}.app{padding-left:9px;padding-right:9px}}</style></head><body><div class="app"><section id="home" class="screen active"><header><h1>写真メモ</h1><div><button class="icon" id="searchBtn">⌕</button></div></header><div class="search" id="search"><input id="searchInput" placeholder="タイトル・メモを検索"></div><div class="cats" id="cats"></div><div class="grid" id="grid"></div><button class="fab" id="add">＋ 追加</button></section><section id="edit" class="screen"><div class="editHead"><button class="icon" id="cancel">×</button><b id="editTitle">写真メモの追加</b><button class="save" id="save">保存</button></div><div class="photoBox" id="photoBox"><button class="photoBtn" id="choose">▧ 写真を選ぶ</button><input type="file" id="file" accept="image/*" capture="environment" hidden></div><div class="field"><label>タイトル</label><input id="title" placeholder="例：消火栓バルブ"></div><div class="field"><label>メモ</label><textarea id="note" placeholder="場所、状態、型番など"></textarea></div><div class="field"><label>カテゴリー</label><div class="editCats" id="editCats"></div></div><button class="delete" id="delete" style="display:none">削除</button><div class="notice">写真とメモはこの端末のブラウザ内に保存されます。</div></section><section id="detail" class="screen detail"><div class="editHead"><button class="icon" id="back">‹</button><b>写真メモ</b><button class="save" id="editBtn">編集</button></div><img class="detailImg" id="detailImg"><h2 id="detailTitle"></h2><span class="badge" id="detailCat"></span><div class="detailMeta" id="detailDate"></div><div class="detailText" id="detailNote"></div></section></div><script>const C=['すべて','仕事','車','家電','買い物','家','その他'];let memos=[],filter='すべて',editing=null,imgData='';try{memos=JSON.parse(localStorage.getItem('photoMemosV1')||'[]')}catch(e){}const $=x=>document.getElementById(x);function persist(){localStorage.setItem('photoMemosV1',JSON.stringify(memos))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function renderCats(){ $('cats').innerHTML=C.map(c=>`<button class="cat ${filter===c?'active':''}" data-c="${c}">${c}</button>`).join('');$('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.c;renderCats();render()})}function renderEditCats(sel='仕事'){$('editCats').innerHTML=C.slice(1).map(c=>`<button class="cat ${sel===c?'active':''}" data-c="${c}">${c}</button>`).join('');$('editCats').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('editCats').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}function render(){let q=$('searchInput').value.toLowerCase(),a=memos.filter(x=>(filter==='すべて'||x.cat===filter)&&(!q||(x.title+x.note).toLowerCase().includes(q)));$('grid').innerHTML=a.length?a.map(x=>`<article class="memo" data-id="${x.id}"><img class="thumb" src="${x.img}"><div class="memoBody"><span class="badge">${x.cat}</span><div class="date">${new Date(x.date).toLocaleString('ja-JP')}</div><h3>${esc(x.title||'無題')}</h3><p>${esc(x.note).slice(0,60)}</p></div></article>`).join(''):'<div class="empty">まだ写真メモはありません。<br>「＋ 追加」から作れます。</div>';$('grid').querySelectorAll('.memo').forEach(x=>x.onclick=()=>openDetail(+x.dataset.id))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function newMemo(){editing=null;imgData='';$('editTitle').textContent='写真メモの追加';$('title').value='';$('note').value='';$('delete').style.display='none';renderEditCats('仕事');photoPreview();show('edit')}function editMemo(){let x=memos.find(x=>x.id===editing);if(!x)return;imgData=x.img;$('editTitle').textContent='写真メモの編集';$('title').value=x.title;$('note').value=x.note;$('delete').style.display='block';renderEditCats(x.cat);photoPreview();show('edit')}function photoPreview(){ $('photoBox').innerHTML=imgData?`<img src="${imgData}" id="preview"><button class="photoBtn" id="choose2" style="position:absolute;bottom:12px">▧ 写真を変更</button>`:`<button class="photoBtn" id="choose2">▧ 写真を選ぶ</button>`;$('choose2').onclick=()=>$('file').click()}function openDetail(id){editing=id;let x=memos.find(x=>x.id===id);if(!x)return;$('detailImg').src=x.img;$('detailTitle').textContent=x.title||'無題';$('detailCat').textContent=x.cat;$('detailDate').textContent=new Date(x.date).toLocaleString('ja-JP');$('detailNote').textContent=x.note||'メモなし';show('detail')}$('add').onclick=newMemo;$('cancel').onclick=()=>show('home');$('back').onclick=()=>show('home');$('editBtn').onclick=editMemo;$('choose').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let max=1200,sc=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);imgData=cv.toDataURL('image/jpeg',.72);photoPreview()};im.src=r.result};r.readAsDataURL(f);e.target.value=''};$('save').onclick=()=>{if(!imgData)return alert('写真を選んでください');let cat=$('editCats').querySelector('.active')?.dataset.c||'その他';if(editing){let x=memos.find(x=>x.id===editing);Object.assign(x,{img:imgData,title:$('title').value.trim(),note:$('note').value.trim(),cat})}else{memos.unshift({id:Date.now(),img:imgData,title:$('title').value.trim(),note:$('note').value.trim(),cat,date:new Date().toISOString()})}try{persist()}catch(e){return alert('保存容量がいっぱいです。写真を減らしてください。')}render();show('home')};$('delete').onclick=()=>{if(confirm('この写真メモを削除しますか？')){memos=memos.filter(x=>x.id!==editing);persist();render();show('home')}};$('searchBtn').onclick=()=>$('search').classList.toggle('show');$('searchInput').oninput=render;renderCats();render();</script></body></html>
