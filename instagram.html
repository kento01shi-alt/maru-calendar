<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Instagram画像一覧</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px 40px}h1{font-size:23px;margin:5px 0 15px}.search{display:flex;gap:8px;background:#fff;border:1px solid #e2e4e8;border-radius:16px;padding:8px;box-shadow:0 4px 18px #0000000c}.search input{min-width:0;flex:1;border:0;outline:0;font-size:16px;padding:10px;background:transparent}.search button,.add{border:0;border-radius:11px;background:#1769aa;color:#fff;font-weight:700;padding:0 16px}.sub{font-size:12px;color:#777;line-height:1.6;margin:10px 3px 16px}.profile{display:none;background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #e4e6e9}.profile.show{display:flex;justify-content:space-between;align-items:center;gap:10px}.profile b{font-size:18px}.profile a{color:#1769aa;text-decoration:none}.toolbar{display:none;gap:8px;margin:10px 0}.toolbar.show{display:flex}.add{padding:11px 14px}.clear{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tile{aspect-ratio:1;background:#e6e8eb;position:relative;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile a{position:absolute;inset:0}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cfd3d8;border-radius:16px;padding:35px 20px;text-align:center;color:#666;line-height:1.8}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:18px;width:min(430px,100%);padding:18px}.box h2{font-size:19px;margin:0 0 12px}.box textarea{width:100%;height:110px;border:1px solid #ccc;border-radius:11px;padding:10px;font-size:14px}.box button{width:100%;margin-top:9px;padding:12px;border:0;border-radius:10px;background:#1769aa;color:#fff;font-weight:700}.box .cancel{background:#eee;color:#111}@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr);gap:5px}}</style></head><body><main class="app"><h1>Instagram画像一覧</h1><div class="search"><input id="user" placeholder="ユーザー名 例：uesaka_sumire" autocomplete="off"><button id="go">表示</button></div><div class="sub">公開アカウントをユーザー名で切り替えられます。画像一覧はこの端末だけに保存されます。</div><section class="profile" id="profile"><div><b id="name"></b><div id="num"></div></div><a id="insta" target="_blank" rel="noopener">Instagramを開く</a></section><div class="toolbar" id="toolbar"><button class="add" id="add">＋ 画像を追加</button><button class="clear" id="clear">一覧を消す</button></div><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="box"><h2>画像を追加</h2><div class="sub">画像URLを1行に1つ貼ってください。投稿URLも「画像URL | 投稿URL」の形で登録できます。</div><textarea id="urls" placeholder="https://...jpg&#10;https://...jpg | https://www.instagram.com/p/.../"></textarea><button id="save">追加する</button><button class="cancel" id="cancel">キャンセル</button></div></div><script>(()=>{const $=x=>document.getElementById(x);let user='';const key=u=>'igGallery:'+u.toLowerCase();function clean(v){return v.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').split(/[\/?#]/)[0].replace(/[^A-Za-z0-9._]/g,'')}function load(){let a=[];try{a=JSON.parse(localStorage.getItem(key(user))||'[]')}catch(e){}return a}function draw(){if(!user)return;let a=load();$('profile').classList.add('show');$('toolbar').classList.add('show');$('name').textContent='@'+user;$('num').textContent=a.length+' 枚';$('insta').href='https://www.instagram.com/'+encodeURIComponent(user)+'/';$('grid').innerHTML=a.length?a.map((x,i)=>'<div class="tile"><img loading="lazy" src="'+esc(x.image)+'" alt=""><a href="'+esc(x.post||x.image)+'" target="_blank" rel="noopener" aria-label="画像 '+(i+1)+'"></a></div>').join(''):'<div class="empty">まだ画像が登録されていません。<br>「＋ 画像を追加」から一覧に追加できます。</div>';history.replaceState(null,'','?user='+encodeURIComponent(user))}function show(){let u=clean($('user').value);if(!u)return;user=u;$('user').value=u;draw()}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}$('go').onclick=show;$('user').onkeydown=e=>{if(e.key==='Enter')show()};$('add').onclick=()=>$('modal').classList.add('show');$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{let old=load(),lines=$('urls').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);for(let line of lines){let [image,post]=line.split('|').map(x=>x.trim());if(/^https?:\/\//i.test(image))old.push({image,post:post||image})}localStorage.setItem(key(user),JSON.stringify(old));$('urls').value='';$('modal').classList.remove('show');draw()};$('clear').onclick=()=>{if(confirm('@'+user+' の一覧を消しますか？')){localStorage.removeItem(key(user));draw()}};let q=new URLSearchParams(location.search).get('user');if(q){$('user').value=q;show()}else{$('user').value='uesaka_sumire';show()}})();</script></body></html>
