<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Instagram画像一覧</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 12px 50px}h1{font-size:24px;margin:5px 2px 15px}.search{display:flex;gap:8px;background:#fff;border:1px solid #e2e4e8;border-radius:16px;padding:8px;box-shadow:0 4px 18px #0000000c}.search input{min-width:0;flex:1;border:0;outline:0;font-size:16px;padding:10px;background:transparent}.btn{border:0;border-radius:11px;background:#1769aa;color:#fff;font-weight:700;padding:0 16px}.sub{font-size:12px;color:#777;line-height:1.6;margin:10px 3px 16px}.profile{display:none;background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #e4e6e9}.profile.show{display:flex;justify-content:space-between;align-items:center;gap:10px}.profile b{font-size:18px}.profile a{color:#1769aa;text-decoration:none}.status{text-align:center;padding:24px;color:#666}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tile{aspect-ratio:1;background:#e6e8eb;position:relative;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile a{position:absolute;inset:0}.more{display:none;width:100%;margin:15px 0;border:0;border-radius:13px;padding:14px;background:#fff;color:#1769aa;font-weight:700;border:1px solid #dce2e9}.setup{display:none;background:#fff;border:1px solid #e1e4e8;border-radius:17px;padding:18px;margin-top:14px}.setup.show{display:block}.setup h2{font-size:18px;margin:0 0 8px}.setup input{width:100%;font-size:15px;padding:12px;border:1px solid #ccd1d8;border-radius:10px;margin:7px 0}.setup button{width:100%;padding:12px;border:0;border-radius:10px;background:#1769aa;color:#fff;font-weight:700}.setup a{color:#1769aa}.error{color:#c62828;background:#fff1f1;border-radius:12px;padding:13px;line-height:1.55}@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr);gap:5px}}</style></head><body><main class="app"><h1>Instagram画像一覧</h1><div class="search"><input id="user" placeholder="ユーザー名 例：uesaka_sumire" autocomplete="off"><button class="btn" id="go">表示</button></div><div class="sub">公開アカウントの投稿画像を自動で読み込みます。ユーザー名を変えれば別のアカウントも表示できます。</div><section class="profile" id="profile"><div><b id="name"></b><div id="num"></div></div><a id="insta" target="_blank" rel="noopener">Instagramを開く</a></section><div id="status" class="status"></div><div class="grid" id="grid"></div><button class="more" id="more">さらに読み込む</button><section class="setup" id="setup"><h2>最初の1回だけ設定</h2><div class="sub">Instagramの公開投稿を取得するため、ExtractrのAPIキーが必要です。無料枠があります。キーはこのSafari内だけに保存し、GitHubには保存しません。</div><a href="https://extractr.dev/" target="_blank" rel="noopener">Extractrで無料キーを作る</a><input id="apiKey" type="password" placeholder="ext_live_..."><button id="saveKey">キーを保存して表示</button></section></main><script>(()=>{const $=x=>document.getElementById(x);let user='',cursor='',loading=false,total=0,shown=0;const KEY='igExtractrApiKey';function clean(v){return v.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').split(/[\/?#]/)[0].replace(/[^A-Za-z0-9._]/g,'')}function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}function key(){return localStorage.getItem(KEY)||''}function setStatus(t,err=false){$('status').innerHTML=t?'<div class="'+(err?'error':'')+'">'+t+'</div>':''}function reset(){cursor='';total=0;shown=0;$('grid').innerHTML='';$('more').style.display='none';$('profile').classList.remove('show')}async function fetchPage(first=false){if(loading)return;let api=key();if(!api){$('setup').classList.add('show');setStatus('下の「最初の1回だけ設定」を済ませると、自動で画像が並びます。');return}loading=true;$('setup').classList.remove('show');setStatus(first?'投稿を読み込み中…':'続きを読み込み中…');$('more').disabled=true;try{let url='https://api.extractr.dev/instagram/get_posts?username='+encodeURIComponent(user)+'&count=50'+(cursor?'&cursor='+encodeURIComponent(cursor):'');let r=await fetch(url,{headers:{'X-API-Key':api,'Accept':'application/json'}});if(!r.ok){if(r.status===401||r.status===403){localStorage.removeItem(KEY);$('setup').classList.add('show');throw new Error('APIキーを確認してください。')}if(r.status===402)throw new Error('APIの無料クレジットを使い切っています。');throw new Error('取得できませんでした（'+r.status+'）。')}let j=await r.json();total=j.total_posts||total;let posts=Array.isArray(j.posts)?j.posts:[];for(const p of posts){let img=p.display_url||p.thumbnail_url;if(!img)continue;let d=document.createElement('div');d.className='tile';d.innerHTML='<img loading="lazy" src="'+esc(img)+'" alt=""><a href="'+esc(p.url||('https://www.instagram.com/p/'+p.shortcode+'/'))+'" target="_blank" rel="noopener" aria-label="Instagram投稿を開く"></a>';$('grid').appendChild(d);shown++}cursor=j.next_cursor||'';$('profile').classList.add('show');$('name').textContent='@'+user;$('num').textContent=shown+(total?' / '+total:'')+' 投稿';$('insta').href='https://www.instagram.com/'+encodeURIComponent(user)+'/';setStatus(posts.length?'':'投稿が見つかりませんでした。',false);$('more').style.display=j.has_more&&cursor?'block':'none';history.replaceState(null,'','?user='+encodeURIComponent(user))}catch(e){setStatus(esc(e.message||'取得に失敗しました。'),true)}finally{loading=false;$('more').disabled=false}}function show(){let u=clean($('user').value);if(!u)return;user=u;$('user').value=u;reset();fetchPage(true)}$('go').onclick=show;$('user').onkeydown=e=>{if(e.key==='Enter')show()};$('more').onclick=()=>fetchPage(false);$('saveKey').onclick=()=>{let v=$('apiKey').value.trim();if(!v)return;localStorage.setItem(KEY,v);$('apiKey').value='';$('setup').classList.remove('show');reset();fetchPage(true)};let q=new URLSearchParams(location.search).get('user');$('user').value=clean(q||'uesaka_sumire');show()})();</script></body></html>
