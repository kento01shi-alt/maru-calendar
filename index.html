<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>○カレンダー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px 20px}.header{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;height:64px}.nav{border:0;background:#fff;font-size:40px;color:#1769aa}.title{text-align:center;font-weight:700;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{border-bottom:1px solid #ddd}.week div{text-align:center;font-weight:700;padding:10px 0}.sun,.holiday{color:#e53935!important}.sat{color:#1976d2!important}.grid{border-left:1px solid #e6e6e6}.day{appearance:none;-webkit-appearance:none;font:inherit;color:#111;background:#fff;position:relative;border:0;border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;min-height:74px;padding:10px 1px 20px;display:flex;justify-content:center;align-items:flex-start}.empty{background:#fafafa}.num{position:relative;display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;font-size:18px;z-index:1}.marked .num:after{content:"";position:absolute;inset:0;border:3px solid #ef3f45;border-radius:50%;z-index:-1}.hname{position:absolute;bottom:5px;left:1px;right:1px;font-size:8px;line-height:1.05;text-align:center;color:#e53935}.help{text-align:center;color:#777;font-size:12px;line-height:1.55;margin-top:14px}@media(max-width:390px){.day{min-height:68px}.title{font-size:20px}}
</style></head><body><div class="app"><div class="header"><button class="nav" id="prev">‹</button><div class="title" id="title"></div><button class="nav" id="next">›</button></div><div class="week"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div><div class="grid" id="grid"></div><div class="help">日付をタップ → ○　もう一度タップ → 解除<br>予定名・時刻・保存操作はありません</div></div><script>
(function(){const grid=document.getElementById('grid'),title=document.getElementById('title'),now=new Date();let y=now.getFullYear(),m=now.getMonth(),marks=new Set();try{marks=new Set(JSON.parse(localStorage.getItem('circleMarks')||'[]'))}catch(e){}const pad=n=>String(n).padStart(2,'0'),K=(Y,M,D)=>Y+'-'+pad(M+1)+'-'+pad(D),nthMon=(Y,M,n)=>{let d=new Date(Y,M,1),a=(8-d.getDay())%7;return 1+a+(n-1)*7},eq=(Y,s)=>Math.floor((s?20.8431:23.2488)+.242194*(Y-1980)-Math.floor((Y-1980)/4));function holidays(Y){let h={},a=(M,D,N)=>h[K(Y,M-1,D)]=N;a(1,1,'元日');a(1,nthMon(Y,0,2),'成人の日');a(2,11,'建国記念の日');if(Y>=2020)a(2,23,'天皇誕生日');a(3,eq(Y,true),'春分の日');a(4,29,'昭和の日');a(5,3,'憲法記念日');a(5,4,'みどりの日');a(5,5,'こどもの日');a(7,nthMon(Y,6,3),'海の日');a(8,11,'山の日');a(9,nthMon(Y,8,3),'敬老の日');a(9,eq(Y,false),'秋分の日');a(10,nthMon(Y,9,2),'スポーツの日');a(11,3,'文化の日');a(11,23,'勤労感謝の日');let base={...h};for(let d=new Date(Y,0,2);d<=new Date(Y,11,30);d.setDate(d.getDate()+1)){let k=K(Y,d.getMonth(),d.getDate());if(h[k])continue;let p=new Date(d),n=new Date(d);p.setDate(p.getDate()-1);n.setDate(n.getDate()+1);if(h[K(p.getFullYear(),p.getMonth(),p.getDate())]&&h[K(n.getFullYear(),n.getMonth(),n.getDate())])h[k]='休日'}for(const k0 in base){let q=k0.split('-').map(Number),d=new Date(q[0],q[1]-1,q[2]);if(d.getDay()!=0)continue;let s=new Date(d);do{s.setDate(s.getDate()+1)}while(h[K(s.getFullYear(),s.getMonth(),s.getDate())]);if(s.getFullYear()==Y)h[K(Y,s.getMonth(),s.getDate())]='振替休日'}return h}function render(){title.textContent=y+'年'+(m+1)+'月';const hs=holidays(y),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let s='';for(let i=0;i<first;i++)s+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=K(y,m,d),c='day'+(dt.getDay()==0?' sun':'')+(dt.getDay()==6?' sat':'')+(hs[k]?' holiday':'')+(marks.has(k)?' marked':'');s+='<button class="'+c+'" data-date="'+k+'"><span class="num">'+d+'</span>'+(hs[k]?'<span class="hname">'+hs[k]+'</span>':'')+'</button>'}grid.innerHTML=s;grid.querySelectorAll('.day[data-date]').forEach(el=>el.onclick=()=>{let k=el.dataset.date;if(marks.has(k))marks.delete(k);else marks.add(k);localStorage.setItem('circleMarks',JSON.stringify([...marks]));el.classList.toggle('marked')})}document.getElementById('prev').onclick=()=>{if(--m<0){m=11;y--}render()};document.getElementById('next').onclick=()=>{if(++m>11){m=0;y++}render()};render()})();
</script></body></html>
