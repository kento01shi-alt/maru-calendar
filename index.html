<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>○カレンダー</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overscroll-behavior-x:none}.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 22px);touch-action:pan-y}.header{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;height:64px}.nav{border:0;background:#fff;font-size:40px;color:#1769aa}.title{text-align:center;font-weight:700;font-size:22px;cursor:pointer}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{border-bottom:1px solid #ddd}.week div{text-align:center;font-weight:700;padding:10px 0}.sun,.holiday{color:#e53935!important}.sat{color:#1976d2!important}.grid{border-left:1px solid #e6e6e6}.day{appearance:none;-webkit-appearance:none;font:inherit;color:#111;background:#fff;position:relative;border:0;border-right:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;min-height:74px;padding:10px 1px 20px;display:flex;justify-content:center;align-items:flex-start}.empty{background:#fafafa}.today{background:#fff8d9}.num{position:relative;display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;font-size:18px;z-index:1}.mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:38px;font-weight:500;line-height:1;z-index:-1}.mark.circle{border:3px solid var(--mc);border-radius:50%}.mark.triangle{font-size:39px;color:var(--mc);transform:translateY(-1px)}.mark.cross{font-size:37px;color:var(--mc);font-weight:400}.hname{position:absolute;bottom:5px;left:1px;right:1px;font-size:8px;line-height:1.05;text-align:center;color:#e53935}.tools{margin-top:14px;border-top:1px solid #eee;padding-top:12px}.count{text-align:center;font-size:14px;font-weight:600;margin-bottom:10px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tool{border:1px solid #d5d5d5;border-radius:10px;background:#fff;padding:10px 4px;font-size:14px;color:#111}.tool.active{background:#eaf3ff;border-color:#1769aa;color:#1769aa}.panel{display:none;margin-top:9px;padding:10px;border-radius:12px;background:#f6f6f6}.panel.show{display:block}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.choice{min-width:48px;border:1px solid #ccc;background:#fff;border-radius:9px;padding:8px 10px;font-size:16px}.choice.sel{border:2px solid #1769aa}.colorDot{display:inline-block;width:17px;height:17px;border-radius:50%;vertical-align:-3px;margin-right:4px}.weekdayChoices{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:9px}.weekdayChoices button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 0}.weekdayChoices button.sel{background:#eaf3ff;border-color:#1769aa}.apply{width:100%;border:0;border-radius:9px;background:#1769aa;color:#fff;padding:10px;font-size:14px}.list{font-size:13px;line-height:1.8;text-align:center;word-break:break-all}.hint{text-align:center;color:#777;font-size:11px;line-height:1.5;margin-top:11px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(330px,100%);background:#fff;border-radius:16px;padding:18px}.box h3{margin:0 0 14px;text-align:center}.jumpRow{display:flex;gap:8px}.jumpRow select{flex:1;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}.boxBtns{display:flex;gap:8px;margin-top:14px}.boxBtns button{flex:1;padding:10px;border:0;border-radius:9px;font-size:15px}.cancel{background:#eee}.go{background:#1769aa;color:#fff}@media(max-width:390px){.day{min-height:68px}.title{font-size:20px}.tool{font-size:13px}}
</style></head><body><div class="app" id="app"><div class="header"><button class="nav" id="prev">‹</button><div class="title" id="title"></div><button class="nav" id="next">›</button></div><div class="week"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div><div class="grid" id="grid"></div><div class="tools"><div class="count" id="count"></div><div class="buttons"><button class="tool" id="todayBtn">今日</button><button class="tool" id="colorBtn">色</button><button class="tool" id="symbolBtn">印</button><button class="tool" id="rangeBtn">範囲</button><button class="tool" id="weekdayBtn">曜日一括</button><button class="tool" id="clearBtn">全解除</button><button class="tool" id="listBtn">選択日一覧</button><button class="tool" id="jumpBtn">月ジャンプ</button></div><div class="panel" id="colorPanel"><div class="choices" id="colorChoices"></div></div><div class="panel" id="symbolPanel"><div class="choices" id="symbolChoices"><button class="choice sel" data-symbol="circle">○</button><button class="choice" data-symbol="triangle">△</button><button class="choice" data-symbol="cross">×</button></div></div><div class="panel" id="rangePanel"><div class="list" id="rangeText">開始日をタップしてください</div></div><div class="panel" id="weekdayPanel"><div class="weekdayChoices" id="weekdayChoices"></div><button class="apply" id="weekdayApply">選んだ曜日をこの月に付ける</button></div><div class="panel" id="listPanel"><div class="list" id="selectedList"></div></div></div><div class="hint">普通に日付をタップ → 印を付ける/消す　左右スワイプ → 前月・翌月<br>上の年月をタップしても月ジャンプできます</div></div><div class="modal" id="jumpModal"><div class="box"><h3>月ジャンプ</h3><div class="jumpRow"><select id="yearSel"></select><select id="monthSel"></select></div><div class="boxBtns"><button class="cancel" id="jumpCancel">キャンセル</button><button class="go" id="jumpGo">移動</button></div></div></div><script>
(function(){const app=document.getElementById('app'),grid=document.getElementById('grid'),title=document.getElementById('title'),now=new Date();let y=now.getFullYear(),m=now.getMonth(),data={},currentColor='red',currentSymbol='circle',rangeMode=false,rangeStart=null;const colors={red:'#ef3f45',blue:'#2878d0',green:'#25a05a',black:'#222'};try{data=JSON.parse(localStorage.getItem('calendarMarksV2')||'{}')||{}}catch(e){}if(!Object.keys(data).length){try{for(const k of JSON.parse(localStorage.getItem('circleMarks')||'[]'))data[k]={color:'red',symbol:'circle'}}catch(e){}save()}function save(){localStorage.setItem('calendarMarksV2',JSON.stringify(data))}const pad=n=>String(n).padStart(2,'0'),K=(Y,M,D)=>Y+'-'+pad(M+1)+'-'+pad(D),nthMon=(Y,M,n)=>{let d=new Date(Y,M,1),a=(8-d.getDay())%7;return 1+a+(n-1)*7},eq=(Y,s)=>Math.floor((s?20.8431:23.2488)+.242194*(Y-1980)-Math.floor((Y-1980)/4));function holidays(Y){let h={},a=(M,D,N)=>h[K(Y,M-1,D)]=N;a(1,1,'元日');a(1,nthMon(Y,0,2),'成人の日');a(2,11,'建国記念の日');if(Y>=2020)a(2,23,'天皇誕生日');a(3,eq(Y,true),'春分の日');a(4,29,'昭和の日');a(5,3,'憲法記念日');a(5,4,'みどりの日');a(5,5,'こどもの日');a(7,nthMon(Y,6,3),'海の日');a(8,11,'山の日');a(9,nthMon(Y,8,3),'敬老の日');a(9,eq(Y,false),'秋分の日');a(10,nthMon(Y,9,2),'スポーツの日');a(11,3,'文化の日');a(11,23,'勤労感謝の日');let base={...h};for(let d=new Date(Y,0,2);d<=new Date(Y,11,30);d.setDate(d.getDate()+1)){let k=K(Y,d.getMonth(),d.getDate());if(h[k])continue;let p=new Date(d),n=new Date(d);p.setDate(p.getDate()-1);n.setDate(n.getDate()+1);if(h[K(p.getFullYear(),p.getMonth(),p.getDate())]&&h[K(n.getFullYear(),n.getMonth(),n.getDate())])h[k]='休日'}for(const k0 in base){let q=k0.split('-').map(Number),d=new Date(q[0],q[1]-1,q[2]);if(d.getDay()!=0)continue;let s=new Date(d);do{s.setDate(s.getDate()+1)}while(h[K(s.getFullYear(),s.getMonth(),s.getDate())]);if(s.getFullYear()==Y)h[K(Y,s.getMonth(),s.getDate())]='振替休日'}return h}function markHTML(v){if(!v)return'';let c=colors[v.color]||colors.red;if(v.symbol==='triangle')return'<span class="mark triangle" style="--mc:'+c+'">△</span>';if(v.symbol==='cross')return'<span class="mark cross" style="--mc:'+c+'">×</span>';return'<span class="mark circle" style="--mc:'+c+'"></span>'}function render(){title.textContent=y+'年'+(m+1)+'月';const hs=holidays(y),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),todayK=K(now.getFullYear(),now.getMonth(),now.getDate());let s='';for(let i=0;i<first;i++)s+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=K(y,m,d),c='day'+(dt.getDay()==0?' sun':'')+(dt.getDay()==6?' sat':'')+(hs[k]?' holiday':'')+(k===todayK?' today':'');s+='<button class="'+c+'" data-date="'+k+'"><span class="num">'+d+markHTML(data[k])+'</span>'+(hs[k]?'<span class="hname">'+hs[k]+'</span>':'')+'</button>'}grid.innerHTML=s;grid.querySelectorAll('.day[data-date]').forEach(el=>el.onclick=()=>tapDate(el.dataset.date));updateCount();updateList()}function tapDate(k){if(rangeMode){if(!rangeStart){rangeStart=k;document.getElementById('rangeText').textContent='開始：'+fmt(k)+'　終了日をタップ';return}let a=new Date(rangeStart+'T00:00:00'),b=new Date(k+'T00:00:00');if(a>b)[a,b]=[b,a];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))data[K(d.getFullYear(),d.getMonth(),d.getDate())]={color:currentColor,symbol:currentSymbol};save();rangeMode=false;rangeStart=null;document.getElementById('rangeBtn').classList.remove('active');document.getElementById('rangePanel').classList.remove('show');render();return}if(data[k])delete data[k];else data[k]={color:currentColor,symbol:currentSymbol};save();render()}function updateCount(){let prefix=y+'-'+pad(m+1)+'-',arr=Object.keys(data).filter(k=>k.startsWith(prefix));let circles=arr.filter(k=>(data[k].symbol||'circle')==='circle').length;document.getElementById('count').textContent='今月：印 '+arr.length+'日（○ '+circles+'日）'}function updateList(){let prefix=y+'-'+pad(m+1)+'-',arr=Object.keys(data).filter(k=>k.startsWith(prefix)).sort();document.getElementById('selectedList').textContent=arr.length?arr.map(k=>Number(k.slice(8))+'日 '+sym(data[k].symbol)).join('　'):'この月には印がありません'}function sym(s){return s==='triangle'?'△':s==='cross'?'×':'○'}function fmt(k){let q=k.split('-').map(Number);return q[1]+'/'+q[2]}function prev(){if(--m<0){m=11;y--}render()}function next(){if(++m>11){m=0;y++}render()}document.getElementById('prev').onclick=prev;document.getElementById('next').onclick=next;document.getElementById('todayBtn').onclick=()=>{y=now.getFullYear();m=now.getMonth();render()};function togglePanel(id,btn){document.querySelectorAll('.panel').forEach(p=>{if(p.id!==id)p.classList.remove('show')});document.querySelectorAll('.tool').forEach(b=>{if(b!==btn&&b.id!=='rangeBtn')b.classList.remove('active')});let p=document.getElementById(id);p.classList.toggle('show');btn.classList.toggle('active',p.classList.contains('show'))}const cc=document.getElementById('colorChoices');Object.entries(colors).forEach(([n,c])=>{let b=document.createElement('button');b.className='choice'+(n===currentColor?' sel':'');b.innerHTML='<span class="colorDot" style="background:'+c+'"></span>'+({red:'赤',blue:'青',green:'緑',black:'黒'}[n]);b.onclick=()=>{currentColor=n;cc.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};cc.appendChild(b)});document.getElementById('colorBtn').onclick=function(){togglePanel('colorPanel',this)};document.getElementById('symbolBtn').onclick=function(){togglePanel('symbolPanel',this)};document.querySelectorAll('#symbolChoices .choice').forEach(b=>b.onclick=()=>{currentSymbol=b.dataset.symbol;document.querySelectorAll('#symbolChoices .choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});document.getElementById('rangeBtn').onclick=function(){rangeMode=!rangeMode;rangeStart=null;this.classList.toggle('active',rangeMode);document.getElementById('rangePanel').classList.toggle('show',rangeMode);document.getElementById('rangeText').textContent='開始日をタップしてください'};const wc=document.getElementById('weekdayChoices'),wn=['日','月','火','水','木','金','土'];wn.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.dataset.w=i;b.onclick=()=>b.classList.toggle('sel');wc.appendChild(b)});document.getElementById('weekdayBtn').onclick=function(){togglePanel('weekdayPanel',this)};document.getElementById('weekdayApply').onclick=()=>{let ws=[...wc.querySelectorAll('.sel')].map(b=>+b.dataset.w);if(!ws.length)return;let days=new Date(y,m+1,0).getDate();for(let d=1;d<=days;d++)if(ws.includes(new Date(y,m,d).getDay()))data[K(y,m,d)]={color:currentColor,symbol:currentSymbol};save();render()};document.getElementById('clearBtn').onclick=()=>{if(!confirm((m+1)+'月の印をすべて消しますか？'))return;let p=y+'-'+pad(m+1)+'-';Object.keys(data).forEach(k=>{if(k.startsWith(p))delete data[k]});save();render()};document.getElementById('listBtn').onclick=function(){togglePanel('listPanel',this);updateList()};const modal=document.getElementById('jumpModal'),ys=document.getElementById('yearSel'),ms=document.getElementById('monthSel');for(let Y=2000;Y<=2100;Y++){let o=document.createElement('option');o.value=Y;o.textContent=Y+'年';ys.appendChild(o)}for(let M=1;M<=12;M++){let o=document.createElement('option');o.value=M-1;o.textContent=M+'月';ms.appendChild(o)}function openJump(){ys.value=y;ms.value=m;modal.classList.add('show')}document.getElementById('jumpBtn').onclick=openJump;title.onclick=openJump;document.getElementById('jumpCancel').onclick=()=>modal.classList.remove('show');document.getElementById('jumpGo').onclick=()=>{y=+ys.value;m=+ms.value;modal.classList.remove('show');render()};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};let sx=0,sy=0;app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});app.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>=50&&Math.abs(dx)>Math.abs(dy)*1.2){if(dx<0)next();else prev()}},{passive:true});render()})();
</script></body></html>
