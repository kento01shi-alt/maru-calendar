<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>値段比較</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--text:#172235;--muted:#728197;--line:#dce5ef;--blue:#2578df;--blue2:#edf5ff;--green:#20a464;--red:#e04d57;--shadow:0 8px 25px #18324d10}
[data-theme="dark"]{--bg:#10151d;--card:#19212c;--text:#edf4ff;--muted:#9aabba;--line:#303c49;--blue:#58a6ff;--blue2:#202e3d;--green:#4acb86;--red:#ff6b74;--shadow:0 8px 25px #0004}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(15px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}.wrap{max-width:760px;margin:auto;padding:0 13px}.top{height:62px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:850}.brand span{color:var(--blue)}.iconbtn{border:0;background:transparent;color:var(--text);font-size:23px;width:42px;height:42px;border-radius:12px}.lead{color:var(--muted);font-size:14px;margin:18px 2px 12px}.grid{display:grid;grid-template-columns:1fr;gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.rowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}.remove{border:0;background:transparent;color:var(--red);font-size:18px}.field{display:grid;grid-template-columns:54px 1fr 82px;gap:8px;align-items:center;margin:9px 0}.field.price{grid-template-columns:54px 1fr 30px}.field label{font-size:14px;font-weight:700;color:var(--muted)}input,select{min-width:0;width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:0 11px;font-size:18px}input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--blue) 35%,transparent);border-color:var(--blue)}.actions{display:grid;grid-template-columns:1fr 1.3fr;gap:9px;margin:14px 0}.add,.compare{border:0;border-radius:14px;min-height:52px;font-weight:800}.add{background:var(--card);border:1px solid var(--line);color:var(--text)}.compare{background:var(--blue);color:#fff}.results{display:none}.resultgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.resultCard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow)}.resultCard.win{border:2px solid var(--green)}.tag{font-size:11px;color:white;background:var(--green);border-radius:20px;padding:3px 8px;display:inline-block}.unitprice{font-size:25px;font-weight:850;margin-top:6px}.winner{background:var(--blue2);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center;margin:12px 0}.winner h2{font-size:17px;margin:0 0 6px}.big{font-size:24px;font-weight:900;color:var(--blue)}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:11px 6px;text-align:center}th{color:var(--muted)}.chart,.history{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:13px 0;box-shadow:var(--shadow)}.bars{margin-top:12px}.barrow{display:grid;grid-template-columns:48px 1fr 65px;gap:8px;align-items:center;margin:9px 0;font-size:13px}.track{height:15px;background:var(--blue2);border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--blue);border-radius:20px}.history h3{margin:0 0 10px}.historyItem{border-top:1px solid var(--line);padding:11px 2px;font-size:13px;line-height:1.6}.historyItem:first-child{border-top:0}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:30}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;bottom:0;width:min(82vw,330px);background:var(--card);padding:calc(env(safe-area-inset-top) + 20px) 15px 20px;box-shadow:-10px 0 35px #0005}.panel h2{margin:0 8px 15px}.menuitem{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);padding:16px 9px;font-size:16px}.pickerOverlay{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}.pickerOverlay.open{display:flex}.picker{width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 24px 70px #0005}.pickerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.pickerHead b{font-size:20px}.pickerClose{border:0;background:transparent;color:var(--text);font-size:25px;padding:0 5px}.pickerLabel{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 7px}.pickerChips{display:flex;flex-wrap:wrap;gap:8px}.pickerChip{border:1px solid var(--line);background:var(--blue2);color:var(--text);border-radius:11px;padding:10px 15px;font-size:16px;min-width:58px}.pickerDirect{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:13px}.pickerDirect input{font-size:16px;padding:11px}.pickerUnit{font-weight:700;min-width:25px}
</style>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"></head>
<body>
<header><div class="wrap top"><div class="brand"><span>◆</span> 値段比較</div><div><button class="iconbtn" id="theme" aria-label="ダークモード">☾</button><button class="iconbtn" id="menu" aria-label="メニュー">☰</button></div></div></header>
<main class="wrap">
<p class="lead">容量と値段を入力するだけで、どっちがお得かすぐ分かります。</p>
<div id="products" class="grid"></div>
<div class="actions"><button class="add" id="add">＋ 商品を追加</button><button class="compare" id="compare">⚖ 比較する</button></div>
<section class="results" id="results"><div class="resultgrid" id="resultCards"></div><div class="winner"><h2 id="winnerTitle"></h2><div class="big" id="saving"></div></div><table><thead><tr><th>商品</th><th>容量</th><th>値段</th><th>1単位あたり</th></tr></thead><tbody id="tbody"></tbody></table><div class="chart"><b>1単位あたりの値段比較</b><div class="bars" id="bars"></div></div></section>
<section class="history"><h3>履歴</h3><div id="history"></div></section>
</main>
<div class="drawer" id="drawer"><div class="panel"><h2>◆ 値段比較</h2><button class="menuitem" id="close">✕ 閉じる</button><button class="menuitem" onclick="document.getElementById('products').scrollIntoView()">⚖ 比較する</button><button class="menuitem" onclick="document.querySelector('.history').scrollIntoView()">◷ 履歴</button><button class="menuitem" id="clearHistory">🗑 履歴を削除</button></div></div>
<div class="pickerOverlay" id="pickerOverlay"><div class="picker" id="picker"><div class="pickerHead"><b id="pickerTitle">容量を入力</b><button class="pickerClose" id="pickerClose" type="button">×</button></div><div id="recentBlock"><div class="pickerLabel">最近使った値</div><div class="pickerChips" id="recentChips"></div></div><div class="pickerLabel">よく使う値</div><div class="pickerChips" id="commonChips"></div><div class="pickerDirect"><input id="pickerInput" type="number" inputmode="decimal" placeholder="直接入力"><span class="pickerUnit" id="pickerUnit"></span></div><button id="pickerApply" type="button" style="width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--blue);color:white;font-size:16px;font-weight:800">この数値を入力</button></div></div>
<script>
const units=["g","ml","個","枚","本","その他"];
let items=[{amount:"",price:"",unit:"g"},{amount:"",price:"",unit:"g"}];
function renderProducts(){const box=document.getElementById("products");box.innerHTML="";items.forEach((x,i)=>{const d=document.createElement("div");d.className="product";d.innerHTML=`<div class="rowhead"><b>商品${String.fromCharCode(65+i)}</b>${items.length>2?`<button class="remove" onclick="removeItem(${i})">🗑</button>`:""}</div><div class="field"><label>容量</label><input id="amount${i}" type="number" min="0" step="any" value="${x.amount}" oninput="items[${i}].amount=this.value" onfocus="openPicker('amount',${i},this)" onclick="openPicker('amount',${i},this)"><select id="unit${i}" onchange="items[${i}].unit=this.value">${units.map(u=>`<option ${u===x.unit?"selected":""}>${u}</option>`).join("")}</select></div><div class="field price"><label>値段</label><input id="price${i}" type="number" min="0" step="any" value="${x.price}" oninput="items[${i}].price=this.value" onfocus="openPicker('price',${i},this)" onclick="openPicker('price',${i},this)"><span>円</span></div>`;box.appendChild(d)})}
function removeItem(i){items.splice(i,1);renderProducts()} document.getElementById("add").onclick=()=>{items.push({amount:"",price:"",unit:items[0]?.unit||"g"});renderProducts()};
function yen(n){return Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2})}
document.getElementById("compare").onclick=()=>{const valid=items.map((x,i)=>({...x,i,amount:+x.amount,price:+x.price})).filter(x=>x.amount>0&&x.price>0);if(valid.length<2){alert("2つ以上の商品に容量と値段を入力してください。");return}const us=[...new Set(valid.map(x=>x.unit))];if(us.length>1){alert("比較する商品の単位をそろえてください。");return}valid.forEach(x=>x.per=x.price/x.amount);const best=valid.reduce((a,b)=>a.per<b.per?a:b),worst=Math.max(...valid.map(x=>x.per)),pct=(1-best.per/worst)*100;document.getElementById("resultCards").innerHTML=valid.map(x=>`<div class="resultCard ${x.i===best.i?"win":""}"><b>商品${String.fromCharCode(65+x.i)}</b> ${x.i===best.i?'<span class="tag">最安</span>':''}<div class="unitprice">${yen(x.per)}円</div><small>1${x.unit}あたり</small></div>`).join("");document.getElementById("winnerTitle").textContent=`商品${String.fromCharCode(65+best.i)} が一番お得`;document.getElementById("saving").textContent=pct>0?`最大 約${pct.toFixed(1)}% 安い`:`同じ値段`;document.getElementById("tbody").innerHTML=valid.map(x=>`<tr><td>商品${String.fromCharCode(65+x.i)}</td><td>${x.amount}${x.unit}</td><td>${yen(x.price)}円</td><td>${yen(x.per)}円</td></tr>`).join("");document.getElementById("bars").innerHTML=valid.map(x=>`<div class="barrow"><b>商品${String.fromCharCode(65+x.i)}</b><div class="track"><div class="bar" style="width:${Math.max(8,x.per/worst*100)}%"></div></div><span>${yen(x.per)}円</span></div>`).join("");document.getElementById("results").style.display="block";saveHistory(valid,best,pct);document.getElementById("results").scrollIntoView({behavior:"smooth"})};
function saveHistory(v,b,p){let h=JSON.parse(localStorage.getItem("pcHistory")||"[]");h.unshift({t:new Date().toLocaleString("ja-JP"),txt:v.map(x=>`${x.amount}${x.unit}・${x.price}円`).join(" vs "),win:`商品${String.fromCharCode(65+b.i)} 約${p.toFixed(1)}%安`});localStorage.setItem("pcHistory",JSON.stringify(h.slice(0,10)));renderHistory()}
function renderHistory(){let h=JSON.parse(localStorage.getItem("pcHistory")||"[]");document.getElementById("history").innerHTML=h.length?h.map(x=>`<div class="historyItem"><b>${x.txt}</b><br>${x.win}　${x.t}</div>`).join(""):`<div class="historyItem">まだ比較履歴はありません。</div>`}
const quickCommon={amount:[100,150,200,250,300,500,1000],price:[100,200,300,500,1000,1500,2000]};let pickerState=null;
function getRecent(kind){try{return JSON.parse(localStorage.getItem("pcPickerRecent_"+kind)||"[]")}catch(e){return[]}}
function saveRecent(kind,val){val=Number(val);if(!Number.isFinite(val)||val<=0)return;let a=getRecent(kind).filter(v=>v!==val);a.unshift(val);localStorage.setItem("pcPickerRecent_"+kind,JSON.stringify(a.slice(0,6)))}
function pickerButton(v,kind,i,input){const b=document.createElement("button");b.type="button";b.className="pickerChip";b.textContent=v;b.onclick=()=>applyPickerValue(v,kind,i,input);return b}
function openPicker(kind,i,input){pickerState={kind,i,input};const ov=document.getElementById("pickerOverlay");document.getElementById("pickerTitle").textContent=kind==="amount"?"容量を入力":"値段を入力";const unit=kind==="price"?"円":(document.getElementById("unit"+i)?.value||items[i]?.unit||"");document.getElementById("pickerUnit").textContent=unit;const direct=document.getElementById("pickerInput");direct.value=input.value||"";direct.placeholder=kind==="amount"?"直接入力（例：347）":"直接入力（例：588）";const recent=getRecent(kind),rb=document.getElementById("recentBlock"),rc=document.getElementById("recentChips");rc.innerHTML="";rb.style.display=recent.length?"block":"none";recent.forEach(v=>rc.appendChild(pickerButton(v,kind,i,input)));const cc=document.getElementById("commonChips");cc.innerHTML="";quickCommon[kind].forEach(v=>cc.appendChild(pickerButton(v,kind,i,input)));ov.classList.add("open");setTimeout(()=>input.blur(),0)}
function applyPickerValue(v,kind,i,input){input.value=v;items[i][kind==="amount"?"amount":"price"]=v;saveRecent(kind,v);document.getElementById("pickerInput").blur();setTimeout(()=>document.getElementById("pickerOverlay").classList.remove("open"),60)}
function closePicker(){const direct=document.getElementById("pickerInput");direct.blur();setTimeout(()=>document.getElementById("pickerOverlay").classList.remove("open"),80)}
document.getElementById("pickerClose").onclick=closePicker;document.getElementById("pickerOverlay").onclick=e=>{if(e.target===e.currentTarget)closePicker()};document.getElementById("pickerApply").onclick=()=>{if(!pickerState)return;const v=document.getElementById("pickerInput").value;if(Number(v)>0)applyPickerValue(v,pickerState.kind,pickerState.i,pickerState.input)};
document.getElementById("menu").onclick=()=>document.getElementById("drawer").classList.add("open");document.getElementById("close").onclick=()=>document.getElementById("drawer").classList.remove("open");document.getElementById("drawer").onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("open")};document.getElementById("clearHistory").onclick=()=>{localStorage.removeItem("pcHistory");renderHistory();document.getElementById("drawer").classList.remove("open")};
let dark=localStorage.getItem("pcTheme")==="dark";function theme(){document.documentElement.dataset.theme=dark?"dark":"";document.getElementById("theme").textContent=dark?"☀":"☾"}document.getElementById("theme").onclick=()=>{dark=!dark;localStorage.setItem("pcTheme",dark?"dark":"light");theme()};theme();renderProducts();renderHistory();
</script></body></html>
